appId: posing.camera.app
name: phase-06-scenario-d-explicit-account-a-hide-20260927
---
- launchApp:
    stopApp: false
    clearState: false
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: Jobs
    commands:
      - tapOn:
          text: Back
      - waitForAnimationToEnd
- assertVisible:
    text: Open Settings
- tapOn:
    text: Open Settings
- tapOn:
    text: Open Account
- runFlow:
    when:
      visible:
        text: Sign out
    commands:
      - tapOn:
          text: Sign out
      - extendedWaitUntil:
          visible:
            id: signin.emailEntry
          timeout: 15000
- assertVisible:
    id: signin.emailEntry
- tapOn:
    id: signin.emailEntry
- tapOn:
    id: signin.email
- inputText: ${MAESTRO_A_TEST_EMAIL}
- tapOn:
    id: signin.showPassword
- tapOn:
    id: signin.password
- inputText: ${MAESTRO_A_TEST_PASSWORD}
- tapOn:
    id: signin.showPassword
- tapOn:
    id: signin.submit
- extendedWaitUntil:
    visible:
      text: Sign out
    timeout: 60000
- assertVisible:
    text: Signed in
- assertVisible:
    text: Sign out
- tapOn:
    text: Back
- tapOn:
    text: Back
- tapOn:
    id: poses.jobs
- extendedWaitUntil:
    visible:
      id: jobs.tab.finish
    timeout: 30000
- tapOn:
    id: jobs.tab.finish
- assertVisible:
    text: "server-authoritative-jobs-e2e-final-20260927-1425, Ready, View pose"
- takeScreenshot: 01-account-a-ready-before-hide
- swipe:
    from:
      text: "server-authoritative-jobs-e2e-final-20260927-1425, Ready, View pose"
    direction: LEFT
    duration: 1200
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: jobs.row.remove.998de1bb-a5a3-4d4d-8fbf-b98f2f429798
    timeout: 10000
- assertVisible:
    id: jobs.row.remove.998de1bb-a5a3-4d4d-8fbf-b98f2f429798
- takeScreenshot: 02-remove-action-for-candidate
- tapOn:
    id: jobs.row.remove.998de1bb-a5a3-4d4d-8fbf-b98f2f429798
- assertVisible:
    text: Remove job?
- tapOn:
    text: Remove
- extendedWaitUntil:
    notVisible:
      text: "server-authoritative-jobs-e2e-final-20260927-1425, Ready, View pose"
    timeout: 30000
- assertNotVisible:
    text: "server-authoritative-jobs-e2e-final-20260927-1425, Ready, View pose"
- takeScreenshot: 03-candidate-hidden
