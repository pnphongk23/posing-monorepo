# TC-CAM-004 grid toggle and pose picker from the dock camera
appId: ${APP_ID}
tags: [TC-CAM-004, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.tools"
- tapOn:
    id: "camera.tools.grid"
# The Browse card is the strip's last card and only exists once the catalogue has loaded, so wait for
# it instead of assuming it: a clean launch may still be showing skeleton cards.
- extendedWaitUntil:
    visible:
      id: "camera.choosePose"
    timeout: 20000
- tapOn:
    id: "camera.choosePose"
- assertVisible:
    id: "posePicker.search"
- assertVisible:
    id: "posePicker.grid"
