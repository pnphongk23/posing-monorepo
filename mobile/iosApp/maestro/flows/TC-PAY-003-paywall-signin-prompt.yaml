# TC-PAY-003 the paywall shown to a signed-out user asks them to sign in
#
# Paywall C shows the real prices before sign-in (the offering is read before the session), and the CTA
# answers "Sign in to subscribe", which opens the full-height sign-in sheet. A purchase is Account-bound, so
# there is no guest path. Never tap this CTA on a prod-config build — there it is a live purchase path.
appId: ${APP_ID}
tags: [TC-PAY-003, p1]
---
- runFlow:
    file: ../subflows/launch-paywall.yaml
    env:
      PAYWALL: "YES"
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 30000
# Signed out, the cards still render both plans (with a real price, or "Price unavailable" if the offering
# has not landed yet — the structure is what this case asserts, the values are a TestFlight case).
- assertVisible:
    id: "paywall.plan.monthly"
- assertVisible:
    id: "paywall.account.status"
    text: '.*Sign in first so Premium follows you.*'
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 20000
- assertVisible: "Sign in to subscribe"
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible:
      id: "paywall.signin.sheet"
    timeout: 20000
- assertVisible:
    id: "paywall.signin.apple"
- tapOn:
    id: "paywall.signin.close"
- assertNotVisible:
    id: "paywall.signin.sheet"
