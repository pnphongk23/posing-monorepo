# TC-PAY-003 the paywall shown to a signed-out user asks them to sign in
#
# Paywall C shows the real prices before sign-in (the offering is read before the session) and the line above the
# CTA asks for the account — "Sign in first so Premium follows you." — because a purchase is Account-bound. The
# CTA answers "Sign in to subscribe" and opens the full-height sign-in sheet; there is no guest path.
# Never tap this CTA on a prod-config build: there it is a live purchase path.
appId: ${APP_ID}
tags: [TC-PAY-003, p1]
---
- runFlow:
    file: ../subflows/launch-paywall.yaml
    env:
      PAYWALL: "YES"
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 30000
# Signed out, both cards render. A real price, or "Price unavailable" if the offering has not landed yet —
# the structure is what this case asserts; the values are a TestFlight case (TC-PAY-018/019).
- assertVisible:
    id: "paywall.plan.monthly"
- assertVisible:
    id: "paywall.account.status"
    text: '.*Sign in first so Premium follows you.*'
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 20000
- assertVisible: "Sign in to subscribe"
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible:
      id: "paywall.signin.sheet"
    timeout: 20000
- assertVisible:
    id: "paywall.signin.apple"
- tapOn:
    id: "paywall.signin.close"
- assertNotVisible:
    id: "paywall.signin.sheet"
