# TC-PAY-004 a signed-in account buys a plan through the Test Store and Premium un-gates capture
appId: ${APP_ID}
tags: [TC-PAY-004, p1, e2e]
---
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/pay-sign-in.yaml
# Negative control: a signed-in account with no entitlement is gated and the offering really loaded
# (both package cards present). Without this the "no paywall after the purchase" check at the end
# could pass vacuously.
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "paywall.plan.annual"
- runFlow: ../subflows/pay-buy-monthly.yaml
# Entitlement as the provider reports it on a fresh load of the paywall, not as the purchase call
# happened to return it.
- tapOn:
    id: "camera.close"
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.premium.row"
- extendedWaitUntil:
    visible:
      id: "paywall.status"
    timeout: 20000
- assertVisible: ".*Premium access confirmed.*"
- tapOn:
    id: "paywall.close"
- tapOn: "Back"
# The paid action: the shutter no longer asks for Premium. The simulator cannot photograph, so the
# gate answer is the assertion (PremiumGate.swift:102-118); the photo itself is a device case.
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- assertNotVisible:
    id: "paywall.cta"
- assertNotVisible:
    id: "paywall.signin.apple"
- assertNotVisible:
    id: "paywall.signin"
- assertVisible:
    id: "camera.shutter"
