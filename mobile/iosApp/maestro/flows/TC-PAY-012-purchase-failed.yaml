# TC-PAY-012 a purchase that fails grants nothing and says so
#
# Debug-Dev build with a RevenueCat Test Store key: the SDK dialog offers "Test valid purchase" / "Test
# failed purchase" / "Cancel", so a failure is reproducible with no money. Paywall C reports a failed
# purchase as a settled outcome: the error card (`paywall.notice`) carries the retry (`paywall.retry`), the
# status line states what happened, and the CTA itself becomes "Try again".
appId: ${APP_ID}
tags: [TC-PAY-012, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL_B != null && E2E_EMAIL_B.length > 0 && E2E_PASSWORD_B != null && E2E_PASSWORD_B.length > 0}
    label: "E2E_EMAIL_B / E2E_PASSWORD_B missing - this flow needs the second, never-entitled account"
- runFlow: ../subflows/pay-launch.yaml
# Account B: the cases that need an *unentitled* account, because account A becomes entitled the moment
# TC-PAY-004 buys (Test Store subscriptions persist on the RevenueCat customer).
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
# The paywall is opened from Settings > Premium rather than through the camera gate: after the email sign-in the
# app sits on the signed-in surfaces, and going straight to the paid surface removes the camera round trip and the
# gate state from this case entirely (dev21 pass13: the flow did reach the paywall this way through the camera, but
# the route made every failure ambiguous).
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.premium.row"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 30000
- assertVisible:
    id: "paywall.cta"
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Test failed purchase"
# The settled outcome: card + retry + status line, and the CTA answers the failure.
- extendedWaitUntil:
    visible:
      id: "paywall.notice"
    timeout: 60000
- assertVisible:
    id: "paywall.retry"
- assertVisible:
    id: "paywall.status"
    text: '.*didn.t go through.*'
- assertVisible: "Try again"
# No access: the cover is still up, the camera is not behind it.
- assertNotVisible:
    id: "camera.shutter"
# The retry path — and what is deliberately NOT asserted here.
#
# The store's second prompt is not asserted: the RevenueCat **Test Store** does not re-show it in the same
# session (Feature, build-21 evidence), even though the app does send the second purchase — `PaywallModel`'s
# unit test pins that. So the flow proves the part a simulator can: the retry is offered, tapping it leaves the
# paywall intact and usable (no crash, no stuck spinner, offer still there), and it captures that state.
# A real store re-prompt on retry is a device/sandbox item: TC-PAY-012 in docs/qa/camera-device-checklist.md.
- takeScreenshot: pay012-retry-card
- tapOn:
    id: "paywall.retry"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 20000
- assertVisible:
    id: "paywall.cta"
- assertVisible:
    id: "paywall.close"
- takeScreenshot: pay012-retry-after-tap
- tapOn:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
# The gate is unchanged: the same press asks again instead of capturing.
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
- tapOn:
    id: "paywall.close"
