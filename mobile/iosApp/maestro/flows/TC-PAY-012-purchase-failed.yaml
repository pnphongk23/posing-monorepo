# TC-PAY-012 a purchase that fails grants nothing and says so
#
# Runs on the Debug-Dev build whose RevenueCat key is a Test Store key: the SDK's own dialog offers
# "Test valid purchase" / "Test failed purchase" / "Cancel", so a failure is reproducible with no money
# and no sandbox Apple ID. A real store failure cannot be provoked this way, which is why the provider's
# failure path is also covered at unit level.
appId: ${APP_ID}
tags: [TC-PAY-012, p1, e2e]
---
- runFlow: ../subflows/pay-launch.yaml
# Account B on purpose: these cases need an *unentitled* account, and account A becomes entitled the
# moment TC-PAY-004 buys (Test Store subscriptions persist on the RevenueCat customer). TC-PAY-006 uses
# the same injection.
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Test failed purchase"
# The settled outcome: the card reports the failure through the outcome banner QA reads
# (`paywall.status`, "The purchase didn't go through") and carries the one action that answers it.
- extendedWaitUntil:
    visible:
      id: "paywall.status"
    timeout: 60000
- assertVisible:
    id: "paywall.status"
    text: ".*purchase didn.t go through.*"
- assertVisible:
    id: "paywall.retry"
# No access: the paywall is still up, the camera is not behind it.
- assertNotVisible:
    id: "camera.shutter"
# The retry path: "Try again" starts a fresh store attempt (its dialog is the proof), and cancelling that
# one leaves the user where they were — still unentitled, nothing bought.
- tapOn:
    id: "paywall.retry"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Cancel"
- tapOn:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
# The gate is unchanged: the same press asks again instead of capturing.
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
- tapOn:
    id: "paywall.close"
