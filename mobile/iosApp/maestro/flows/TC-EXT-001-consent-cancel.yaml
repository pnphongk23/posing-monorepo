# TC-EXT-001 consent Cancel sends nothing and keeps the draft
# 1.1 (17) copy variant: the committed flow still asserts the 1.2 (16) wording.
appId: ${APP_ID}
tags: [TC-EXT-001, p0, e2e]
---
# Fail fast instead of typing an unresolved placeholder into the sign-in form.
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/ext-launch.yaml
- runFlow: ../subflows/ext-sign-in.yaml
- runFlow:
    file: ../subflows/ext-add-pose-form.yaml
    env:
      POSE_NAME: "QA consent cancel"
- runFlow:
    when:
      notVisible:
        id: "addPose.consent.message"
    commands:
      - tapOn:
          id: "addPose.submitButton"
# The sheet is the first thing between the tap and any upload.
- extendedWaitUntil:
    visible:
      id: "addPose.consent.message"
    timeout: 15000
- assertVisible:
    id: "addPose.consent.message"
    text: '.*saved privately to your account until you delete your account.*'
- assertVisible:
    id: "addPose.consent.allowButton"
- assertVisible:
    id: "addPose.consent.cancelButton"
- tapOn:
    id: "addPose.consent.cancelButton"
# Cancel: sheet gone, still on the form, draft intact.
- assertNotVisible:
    id: "addPose.consent.message"
- assertVisible:
    id: "addPose.nameField"
    text: "QA consent cancel"
- assertVisible: "Change photo"
- assertVisible:
    id: "addPose.title"
    text: "Add pose"
# No job was started: the same submit asks for consent again (Cancel records no answer).
- runFlow:
    when:
      notVisible:
        id: "addPose.consent.message"
    commands:
      - tapOn:
          id: "addPose.submitButton"
- extendedWaitUntil:
    visible:
      id: "addPose.consent.message"
    timeout: 15000
- tapOn:
    id: "addPose.consent.cancelButton"
# The Jobs list is unchanged: nothing was created with this draft name.
- extendedWaitUntil:
    visible:
      id: "addPose.title"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "poses.more"
    timeout: 15000
- tapOn:
    id: "poses.more"
- extendedWaitUntil:
    visible:
      id: "poses.jobs"
    timeout: 15000
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.processing"
    timeout: 20000
- assertNotVisible: '.*QA consent cancel.*'
- tapOn:
    id: "jobs.tab.finish"
- assertNotVisible: '.*QA consent cancel.*'
