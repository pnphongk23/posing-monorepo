# TC-SET-013 About is a sheet with the app identity and the legal rows
appId: ${APP_ID}
tags: [TC-SET-013, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      id: "settings.about"
    direction: DOWN
    # The About row is the last one on the hub: at the end of the scroll it can sit under the home
    # indicator, so 100% visibility never succeeds.
    visibilityPercentage: 60
- tapOn:
    id: "settings.about"
- assertVisible:
    id: "about.version"
- assertVisible:
    id: "about.terms"
- assertVisible:
    id: "about.privacy"
- assertVisible:
    id: "about.licences"
# The board's "Contact support" row is deliberately not built (no Support surface), so no such id
# exists — guard the row by its label instead of a dead `about.contact` id.
- assertNotVisible: "Contact support"
- tapOn:
    id: "about.close"
- assertNotVisible:
    id: "about.version"
- assertVisible:
    id: "settings.about"
