# TC-SAV-003 unsaving removes the pose from Saved
#
# Starts from the list (TC-SAV-002 guarantees a saved row), empties it, and proves the removal by reloading
# the screen: an optimistic animation is not evidence that the server heard it.
#
# The case's expected result is the EMPTY collection, while the QA account is not guaranteed to hold exactly
# one pose, so the flow unsaves until the empty state appears. `repeat` is bounded: a list that will not
# empty fails here instead of looping forever.
#
# The row tile is addressed by `saved.unsave.<poseID>` (0df8024), so the flow cannot accidentally tap a
# different row's control. The tile is painted enabled while a request is in flight, so each removal is
# followed by an animation wait before the next tap.
appId: ${APP_ID}
tags: [TC-SAV-003, p1]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/pay-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- tapOn:
    id: "settings.saved.row"
- extendedWaitUntil:
    visible:
      id: 'saved\.unsave\..*'
    timeout: 25000
# Unsave every row until the empty state owns the screen (bounded: at most 8 removals).
- repeat:
    while:
      notVisible:
        id: "saved.browseCommunity"
    times: 8
    commands:
      - tapOn:
          id: 'saved\.unsave\..*'
          index: 0
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible:
      id: "saved.browseCommunity"
    timeout: 25000
# Leave and come back: the removal survived a fresh load, so it was a write and not a local hide.
- tapOn:
    id: "saved.back"
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- tapOn:
    id: "settings.saved.row"
- extendedWaitUntil:
    visible:
      id: "saved.browseCommunity"
    timeout: 25000
- assertNotVisible:
    id: "poses.first-card"
