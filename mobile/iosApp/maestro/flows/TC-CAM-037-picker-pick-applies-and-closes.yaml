# TC-CAM-037 picking a pose applies it, closes the sheet and names it on the chip
appId: ${APP_ID}
tags: [TC-CAM-037, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- assertNotVisible:
    id: "camera.poseGuide"
# Nothing picked yet: the control announces "Choose a pose" (label and value both). Design-sync 70d38cfe
# moved the no-pose value from "None selected" to "Choose a pose" — `CameraChromeLayout.posesControlValue`
# only returns "None selected" for a pose with an empty name (CameraFeature.swift:1874-1876 on 9886cb34).
- assertVisible:
    id: "camera.choosePose"
    text: '.*Choose a pose.*'
- runFlow: ../subflows/camera-open-picker.yaml
- assertVisible:
    id: "posePicker.grid"
# The rows carry `posePicker.row.<poseID>`; without a server pose id in the repo the presence of that id is
# asserted by pattern, and the pick goes by the row's `Use <name> pose` label — never a coordinate.
- assertVisible:
    id: 'posePicker\.row\..*'
# The rows carry `posePicker.row.<poseID>` but only their VoiceOver label holds the pose name, and that label
# is not readable back: `copyTextFrom` on '.*Use .* pose.*' leaves `maestro.copiedText` undefined (Maestro
# 2.2.0 — the row's `text` attribute is empty, the name lives in the accessibility label), which made
# `${output.pickedName}` resolve to the string "undefined" and failed the chip assertion on 2026-11-08.
# So the pick goes by the row's label and the chip is asserted by *state*, as the case documents it.
- tapOn: '.*Use .* pose.*'
# No Done step: the selection itself closes the sheet — asserted on the sheet's own container.
- extendedWaitUntil:
    notVisible:
      id: "posePicker.sheet"
    timeout: 15000
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.shutter"
- assertVisible: '.*Change pose.*'
# The chip stopped advertising the empty state and reports the chosen pose by NAME instead (its value), not
# the word "Selected". The name itself is not pinned — no fixture supplies a known pose id.
- assertNotVisible:
    id: "camera.choosePose"
    text: '.*Choose a pose.*'
- takeScreenshot: sheet-pose-applied
