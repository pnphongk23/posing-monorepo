# TC-PAY-015 Terms of Use and Privacy Policy open the real documents from the paywall
#
# Paywall C keeps the legal row (Restore purchases · Terms of Use · Privacy Policy) with the purchase region:
# pinned in the dock below the Accessibility sizes, inside the scroll at AX1–AX5. The flows address it by id.
# The assertion is the document's own text, not "a URL opened": a redirector or a dead host would pass the
# weaker check, which is exactly the failure this case exists to catch.
appId: ${APP_ID}
tags: [TC-PAY-015, p1]
---
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
- assertVisible:
    id: "paywall.restore"
- tapOn:
    id: "paywall.terms"
- extendedWaitUntil:
    visible: 'posing.*Terms of Service'
    timeout: 40000
# Back to the app and the paywall, then the second document.
- launchApp
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 40000
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
- tapOn:
    id: "paywall.privacy"
- extendedWaitUntil:
    visible: 'Privacy Policy'
    timeout: 40000
