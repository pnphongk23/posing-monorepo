# TC-PAY-006 a second account on the same device gets no entitlement from the first account's purchase
appId: ${APP_ID}
tags: [TC-PAY-006, p1, e2e]
---
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/pay-sign-in.yaml
# Account A must hold the entitlement before B arrives. It already does after TC-PAY-004/005 (the
# Test Store subscription persists on A's RevenueCat customer), so the buy only happens on a first
# run; a shutter that gates nothing IS the entitled state this case needs.
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- runFlow:
    when:
      visible:
        id: "paywall.cta"
    commands:
      - runFlow: ../subflows/pay-buy-monthly.yaml
- runFlow:
    when:
      visible:
        id: "camera.shutter"
    commands:
      - tapOn:
          id: "camera.close"
# Hand the device to account B.
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      id: "signin.emailEntry"
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back"
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
# B is signed in and holds nothing: the gate must ask for Premium *without* the sign-in options, the
# offering must load for B, and the paywall must not claim access. A carried-over entitlement would
# have skipped the paywall altogether, so these fail together on a leak.
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "paywall.plan.annual"
- assertNotVisible:
    id: "paywall.signin.apple"
- assertNotVisible:
    id: "paywall.signin"
- assertNotVisible:
    id: "signin.emailEntry"
- assertNotVisible:
    id: "paywall.status"
