# TC-BRW-004 search with a nonsense term shows the empty banner
appId: ${APP_ID}
tags: [TC-BRW-004, p0]
---
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: "poses.open-search"
- tapOn:
    id: "search.field"
- inputText: "zzqqxx"
# The banner is rendered once the search has answered: the id is right (`PosesFeature.swift:2044,2139`), the
# immediate assertion simply raced the debounce + round trip (dev22 red).
- extendedWaitUntil:
    visible:
      id: "search-empty-banner"
    timeout: 20000
- tapOn:
    id: "search.back"
- assertVisible:
    id: "poses.open-search"
