# TC-EXT-003 extractPoseEnabled off hides Add pose everywhere and blocks submit
appId: ${APP_ID}
tags: [TC-EXT-003, p0]
---
# The kill switch is a Debug launch arg; the same argument is the only thing that turns these
# controls on, so this flow fails if any Add pose / Jobs entry leaks through with the flag off.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
      photos: allow
    arguments:
      AIPoseExtractPoseEnabled: "false"
      AIPoseAccountsEnabled: "YES"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
# 1. Poses header: Search and More stay, Add pose does not.
- assertNotVisible:
    id: "poses.add-pose"
- assertVisible:
    id: "poses.more"
# 2. More menu: Settings proves the menu opened; Jobs must not be a usable entry with extraction off.
- tapOn:
    id: "poses.more"
- extendedWaitUntil:
    visible:
      id: "poses.menu.settings"
    timeout: 10000
# The redesign renders the Jobs row disabled (or drops it from the accessibility tree entirely), so the
# tap is conditional: either way the Jobs screen must stay unreachable.
- runFlow:
    when:
      visible:
        id: "poses.jobs"
    commands:
      - tapOn:
          id: "poses.jobs"
- extendedWaitUntil:
    notVisible:
      id: "jobs.tab.processing"
    timeout: 10000
- assertVisible:
    id: "poses.open-search"
# 3. Gallery header: Add pose is flag-gated there too.
- extendedWaitUntil:
    visible: "Gallery"
    timeout: 15000
- tapOn: "Gallery"  # TODO(QA-261029-ID) dock.gallery
- extendedWaitUntil:
    visible:
      id: "gallery.title"
    timeout: 20000
- assertNotVisible:
    id: "gallery.add-pose"
