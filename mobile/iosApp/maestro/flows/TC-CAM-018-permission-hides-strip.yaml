# TC-CAM-018 a refused camera drops the pose picker, and keeps the shutter reachable
appId: ${APP_ID}
tags: [TC-CAM-018, p1]
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: deny
      photos: allow
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
- tapOn:
    id: "dock.camera"
- extendedWaitUntil:
    visible:
      id: "camera.permission"
    timeout: 20000
# No camera means nothing to place a pose on: no Poses chip and no sheet.
- assertNotVisible:
    id: "camera.choosePose"
- assertNotVisible:
    id: "posePicker.search"
- assertNotVisible:
    id: "camera.poseGuide"
# The bar itself stays, so the screen is never a dead end.
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.flip"
- assertVisible:
    id: "camera.close"
- takeScreenshot: permission-refused-chrome
