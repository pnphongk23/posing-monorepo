# TC-CAM-009 camera opened from the Home dock closes back to Home
appId: ${APP_ID}
tags: [TC-CAM-009, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# TODO(QA-261029-ID): camera close button has no id (label "Close camera")
- tapOn: "Close camera"
- assertVisible:
    id: "poses.open-search"
- assertNotVisible:
    id: "camera.shutter"
