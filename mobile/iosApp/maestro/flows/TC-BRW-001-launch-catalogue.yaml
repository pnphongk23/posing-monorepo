# TC-BRW-001 launch shows the catalogue
appId: ${APP_ID}
tags: [TC-BRW-001, p0]
---
- runFlow: ../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 30000
- assertVisible:
    id: "poses.open-search"
- assertVisible: "Gallery"  # TODO(QA-261029-ID) dock.gallery
- scroll
- assertVisible:
    id: "poses.open-search"
