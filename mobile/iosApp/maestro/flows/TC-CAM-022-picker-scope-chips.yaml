# TC-CAM-022 the sheet's All / Saved chips switch the collection in place
appId: ${APP_ID}
tags: [TC-CAM-022, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- runFlow: ../subflows/camera-open-picker.yaml
# The chips sit under the search field (handle → header → search → scopes → results), so they exist as soon as
# the sheet is up — no sign-in or catalogue condition.
- assertVisible:
    id: "posePicker.scope"
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.saved"
    timeout: 15000
- assertVisible:
    id: "posePicker.scope.all"
- assertVisible: '.*Saved poses.*'
- assertVisible: '.*All poses.*'
# Switching scope re-filters the same sheet — it does not close it and the camera stays where it was.
- tapOn:
    id: "posePicker.scope.saved"
- assertVisible:
    id: "posePicker.search"
- assertVisible:
    id: "posePicker.close"
- takeScreenshot: sheet-scopes
# Back to All: the catalogue grid is reachable again in one tap.
- tapOn:
    id: "posePicker.scope.all"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
- tapOn:
    id: "posePicker.close"
- extendedWaitUntil:
    notVisible:
      id: "posePicker.search"
    timeout: 15000
- assertVisible:
    id: "camera.shutter"
