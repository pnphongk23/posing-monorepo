# TC-CAM-022 the sheet's All / Saved chips switch the collection in place, and keep the query
appId: ${APP_ID}
tags: [TC-CAM-022, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- runFlow: ../subflows/camera-open-picker.yaml
# The chips sit under the search field (handle → header → search → scopes → results), so they exist as soon as
# the sheet is up — no sign-in or catalogue condition.
- assertVisible:
    id: "posePicker.scope"
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.saved"
    timeout: 15000
- assertVisible:
    id: "posePicker.scope.all"
- assertVisible: '.*Saved poses.*'
- assertVisible: '.*All poses.*'
# A query first, so the switch has something to keep. "zzzqx" matches nothing in either scope, which makes the
# expectation the same whatever the catalogue holds.
- tapOn:
    id: "posePicker.search"
- inputText: "zzzqx"
- extendedWaitUntil:
    visible:
      id: "posePicker.state"
    timeout: 20000
# Switching scope re-filters the same sheet — it does not close it and it does not eat the typed query.
- tapOn:
    id: "posePicker.scope.saved"
- assertVisible:
    id: "posePicker.search"
    text: '.*zzzqx.*'
- assertVisible:
    id: "posePicker.close"
- assertVisible:
    id: "posePicker.sheet"
- takeScreenshot: sheet-scopes
# Back to All: still the same query, still the same sheet.
- tapOn:
    id: "posePicker.scope.all"
- assertVisible:
    id: "posePicker.search"
    text: '.*zzzqx.*'
# Clearing is the way back to the full grid — one request-free step, in the scope that is showing.
- tapOn:
    id: "posePicker.searchClear"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
- tapOn:
    id: "posePicker.close"
- extendedWaitUntil:
    notVisible:
      id: "posePicker.sheet"
    timeout: 15000
- assertVisible:
    id: "camera.shutter"
