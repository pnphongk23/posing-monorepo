# TC-CAM-021 the pose sheet's search filters by name, empties into the shared card and clears back
appId: ${APP_ID}
tags: [TC-CAM-021, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- runFlow: ../subflows/camera-open-picker.yaml
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
# Sheet up, catalogue loaded: this is the state the reporter shows for the loaded sheet.
- takeScreenshot: sheet-loaded
# A query that cannot match any pose name empties the grid and shows the shared state card.
- assertVisible:
    id: "posePicker.search"
- tapOn:
    id: "posePicker.search"
# `inputText` needs a software keyboard — the one step to watch if a batch ever stalls (Simulator ▸ Keyboard ▸
# Connect Hardware Keyboard off).
- inputText: "zzzqx"
# The All scope asks the server the same question Search asks (debounced ~350 ms, then a round trip), so the
# no-match card arrives after a request rather than on the keystroke — wait for it, never assert on arrival.
- extendedWaitUntil:
    visible:
      id: "posePicker.state"
    timeout: 20000
- assertVisible: '.*No poses match.*'
- assertNotVisible:
    id: "posePicker.grid"
- takeScreenshot: search-empty
# The clear control restores the full grid without refetching or closing the sheet.
- tapOn:
    id: "posePicker.searchClear"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 15000
- assertNotVisible:
    id: "posePicker.state"
- takeScreenshot: search-cleared
# The camera is never left behind the sheet: closing it returns to the chrome.
- tapOn:
    id: "posePicker.close"
- extendedWaitUntil:
    notVisible:
      id: "posePicker.search"
    timeout: 15000
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.choosePose"
