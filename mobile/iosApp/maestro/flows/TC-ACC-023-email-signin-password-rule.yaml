# TC-ACC-023 the password rule is presence only, not length
# TC-ACC-023 the password rule is presence only
# The endpoint accepts z.string().min(1); a stricter client rule would refuse credentials the server
# honours, so a one-character password must NOT be rejected locally.
appId: ${APP_ID}
tags: [TC-ACC-023, p1]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
- tapOn:
    id: "signin.emailEntry"
- tapOn:
    id: "signin.email"
- inputText: "maya@example.com"
- tapOn:
    id: "signin.password"
- inputText: "x"
- assertNotVisible: "Enter your password"
# Erasing it brings the message back: the rule is presence, not length.
- tapOn:
    id: "signin.password"
- eraseText
# The message is written by validation, not by the keystroke, so ask for it again.
- tapOn:
    id: "signin.submit"
- assertVisible: "Enter your password"
