# TC-PAY-017 the paywall survives small screens and the largest text (AX) in dark mode
#
# Runner setup (device state, restored afterwards):
#   xcrun simctl ui <UDID> appearance dark
#   xcrun simctl ui <UDID> content_size accessibility-extra-extra-extra-large     # AX5
#   … run … then: appearance light, content_size large
#
# At AX the compact build-21 layout stops fitting one screen: the steps and the plan cards move into the scroll
# and the legal row leaves the dock for the scroll content (accepted deviation). What must hold is the purchase
# region — account line, CTA — plus the X, and everything else must stay REACHABLE by scrolling. That is the
# case; the real SE frame, the notch status bar and VoiceOver order stay device checks.
#
# Signed in on purpose: the plan cards are the part that has to survive AX. Nothing is bought — the CTA is
# scrolled to and read, never tapped.
appId: ${APP_ID}
tags: [TC-PAY-017, p2, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL_B != null && E2E_EMAIL_B.length > 0 && E2E_PASSWORD_B != null && E2E_PASSWORD_B.length > 0}
    label: "E2E_EMAIL_B / E2E_PASSWORD_B missing - this flow needs the second, never-entitled account"
- runFlow: ../subflows/pay-launch.yaml
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 40000
# The pinned purchase region and the X must be there without any scrolling.
- assertVisible:
    id: "paywall.cta"
- assertVisible: "Unlock the pose camera"
- assertVisible:
    id: "paywall.account.status"
# Everything above the region is reachable by scrolling at AX5 — that is the requirement, not first-frame.
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.plan.annual"
- scrollUntilVisible:
    element:
      id: "paywall.disclosure.autoRenew"
    direction: DOWN
    timeout: 25000
# The legal row moved out of the dock into the scroll: still reachable, never truncated.
- scrollUntilVisible:
    element:
      id: "paywall.privacy"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.terms"
- assertVisible:
    id: "paywall.restore"
- takeScreenshot: ../../../../docs/qa/redesign-drafts/saved-paywall/screens/TC-PAY-017-ax5-dark
