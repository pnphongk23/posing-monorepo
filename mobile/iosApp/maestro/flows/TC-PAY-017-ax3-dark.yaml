# TC-PAY-017 the paywall survives small screens and the largest text (AX) in dark mode
#
# Runner setup (device state, restored afterwards):
#   xcrun simctl ui <UDID> appearance dark
#   xcrun simctl ui <UDID> content_size accessibility-extra-extra-extra-large     # AX5
#   … run … then: appearance light, content_size large
#
# Paywall C puts the CTA and helper line in a pinned purchase region, while below the Accessibility sizes the
# legal row leaves the dock and moves INTO the scroll (accepted deviation). So at AX5 the case is: the X and
# the CTA stay reachable, and the legal row is still reachable — by scrolling. The real SE frame, the notch
# status bar and VoiceOver order stay device checks.
#
# Signed in on purpose: the plan cards are the tall part of the surface and they only render with an
# offering. Nothing is bought — the CTA is scrolled to and read, never tapped.
appId: ${APP_ID}
tags: [TC-PAY-017, p2, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL_B != null && E2E_EMAIL_B.length > 0 && E2E_PASSWORD_B != null && E2E_PASSWORD_B.length > 0}
    label: "E2E_EMAIL_B / E2E_PASSWORD_B missing - this flow needs the second, never-entitled account"
- runFlow: ../subflows/pay-launch.yaml
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 40000
# The purchase region is pinned: helper + CTA are on screen without scrolling, at any text size.
- assertVisible:
    id: "paywall.cta"
- assertVisible:
    id: "paywall.disclosure.selection"
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.plan.annual"
# The legal row moved into the scroll at AX — reachable, which is the requirement.
- scrollUntilVisible:
    element:
      id: "paywall.privacy"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.terms"
- assertVisible:
    id: "paywall.restore"
- assertVisible:
    id: "paywall.close"
- takeScreenshot: ../../../../docs/qa/redesign-drafts/saved-paywall/screens/TC-PAY-017-ax5-dark
