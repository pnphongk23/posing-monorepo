# TC-PAY-017 the paywall survives the largest text (AX) in dark mode
#
# Runner setup (device state, restored afterwards):
#   xcrun simctl ui <UDID> appearance dark
#   xcrun simctl ui <UDID> content_size accessibility-extra-extra-extra-large     # AX5
#   … run … then: appearance light, content_size large
#
# Signed OUT on purpose. The subject of this case is the layout at AX5, and every assertion below is a layout
# fact: the purchase region (account line + CTA) and the X stay pinned, while the steps, the plan cards, the
# auto-renew sentence and the legal row all leave the dock and must stay reachable by scrolling.
#
# The sign-in was dropped from this case after dev21: typing into the sign-in sheet at AX5 does not land in the
# right fields (the run's screenshot shows the EMAIL field holding digits with the app's own invalid-email
# warning, so the sheet never had a valid address to submit). That is a Maestro/typing limitation at AX sizes,
# not an app defect, and proving AX5 sign-in is not what this case is about. Signed-in AX5 parity is pinned by
# unit layout tests (`PaywallScreenLayoutTests` measure AX1/AX3/AX5), and the signed-in CTA copy is covered by
# TC-PAY-004/012/013.
appId: ${APP_ID}
tags: [TC-PAY-017, p2]
---
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 40000
# The pinned region and the X must be there without any scrolling, at any text size.
- assertVisible:
    id: "paywall.close"
- assertVisible:
    id: "paywall.cta"
- assertVisible: "Sign in to subscribe"
- assertVisible:
    id: "paywall.account.status"
# Everything above the region is reachable by scrolling at AX5 — that is the requirement, not first-frame.
- scrollUntilVisible:
    element:
      id: "paywall.steps"
    direction: DOWN
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.plan.annual"
- scrollUntilVisible:
    element:
      id: "paywall.disclosure.autoRenew"
    direction: DOWN
    timeout: 25000
# The legal row left the dock for the scroll content at AX sizes: still reachable, never truncated.
- scrollUntilVisible:
    element:
      id: "paywall.privacy"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.terms"
- assertVisible:
    id: "paywall.restore"
- takeScreenshot: ../../../../docs/qa/redesign-drafts/saved-paywall/screens/TC-PAY-017-ax5-dark
