# TC-GAL-022 signed in, Gallery → Add pose opens the Add pose form (no sign-in prompt)
appId: ${APP_ID}
tags: [TC-GAL-022, p1, e2e]
---
# Promoted after the dev19 probe: signed in, Gallery → Add pose opens the form with no sign-in prompt
# (build 18 reproduced camera-18-06 instead). Credentials come from the runner
# (`-e E2E_EMAIL=... -e E2E_PASSWORD=...`; the flow is e2e-tagged and needs them).
- runFlow: ../subflows/ext-launch.yaml
- runFlow: ../subflows/ext-sign-in.yaml
# Gallery tab (TODO(QA-261029-ID) dock.gallery — the dock item still has a label only).
- tapOn: "Gallery"
- extendedWaitUntil:
    visible:
      id: "gallery.title"
    timeout: 20000
- tapOn:
    id: "gallery.add-pose"
# The form is the destination — not a sign-in prompt.
- extendedWaitUntil:
    visible:
      id: "addPose.photoPicker"
    timeout: 20000
- assertVisible:
    id: "addPose.title"
- assertNotVisible:
    id: "signin.emailEntry"
- assertNotVisible:
    id: "signin.apple"
- assertNotVisible: "Sign in"
