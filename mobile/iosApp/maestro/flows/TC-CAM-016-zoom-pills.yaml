# TC-CAM-016 zoom is a continuous slider, and its value survives a relaunch
appId: ${APP_ID}
tags: [TC-CAM-016, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# Build 23 replaced the lens-aware pills with ONE continuous slider. It reports its factor as a value ("1.0×"), which
# is the only handle a flow has on it: Maestro can read the value, it cannot drag a slider to an exact factor, so
# setting 0.5×/2×/3× and comparing the preview against the captured photo is the device item (checklist §7).
- extendedWaitUntil:
    visible:
      id: "camera.zoom.slider"
    timeout: 15000
- assertVisible:
    id: "camera.zoom.slider"
    text: '.*[0-9]\.[0-9]×.*'
- assertVisible: '.*Zoom.*'
# The retired presets must not come back: no flow and no screen should find them.
- assertNotVisible:
    id: "camera.zoom.0.5x"
- assertNotVisible:
    id: "camera.zoom.1x"
- assertNotVisible:
    id: "camera.zoom.2x"
- assertNotVisible:
    id: "camera.zoom.3x"
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.close"
# The zoom setting is persisted like every other camera setting: after a relaunch the slider is back with a value.
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-camera.yaml
- extendedWaitUntil:
    visible:
      id: "camera.zoom.slider"
    timeout: 15000
- assertVisible:
    id: "camera.zoom.slider"
    text: '.*[0-9]\.[0-9]×.*'
- assertVisible:
    id: "camera.shutter"
