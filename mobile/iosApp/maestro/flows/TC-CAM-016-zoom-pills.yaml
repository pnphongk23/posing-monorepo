# TC-CAM-016 zoom is a 1×/2× lens row, and the chosen lens survives a relaunch
appId: ${APP_ID}
tags: [TC-CAM-016, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# Build 26 (owner decision 2026-11-08) draws only two lens buttons, 1× and 2×. Tap jumps to the lens; the row
# hides behind a 1 pt dial that a drag opens, and the dial is not asserted here — Maestro cannot drag a track to a
# factor and the row collapses ~1 s after release, so "drag opens the dial" stays a device check (checklist §7).
- assertVisible:
    id: "camera.zoom.lens.1x"
- assertVisible:
    id: "camera.zoom.lens.2x"
- assertNotVisible:
    id: "camera.zoom.lens.0.5x"
- assertNotVisible:
    id: "camera.zoom.lens.3x"
# Tapping 2× stays on the camera (no cycling, no navigation) and the dial stays closed.
- tapOn:
    id: "camera.zoom.lens.2x"
- assertVisible:
    id: "camera.zoom.lens.2x"
- assertNotVisible:
    id: "camera.zoom.slider"
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.close"
# The zoom choice is persisted like the other camera settings.
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-camera.yaml
- assertVisible:
    id: "camera.zoom.lens.2x"
- assertVisible:
    id: "camera.shutter"
