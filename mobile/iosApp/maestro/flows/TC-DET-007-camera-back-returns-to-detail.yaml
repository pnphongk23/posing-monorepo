# TC-DET-007 Use this pose then closing the camera returns to the same pose detail
appId: ${APP_ID}
tags: [TC-DET-007, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- copyTextFrom:
    id: "poseDetail.title"
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.shutter"
    timeout: 20000
- assertVisible:
    id: "camera.poseGuide"
    text: ${maestro.copiedText}
- tapOn:
    id: "camera.close"
- extendedWaitUntil:
    visible:
      id: "poseDetail.title"
      text: ${maestro.copiedText}
    timeout: 10000
- assertVisible:
    id: "poseDetail.use"
- assertNotVisible:
    id: "poses.open-search"
