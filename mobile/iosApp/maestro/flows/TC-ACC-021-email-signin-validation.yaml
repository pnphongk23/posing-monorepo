# TC-ACC-021 empty fields are answered in place, per field
# TC-ACC-021 empty fields are answered in place
# Copy is asserted verbatim from SignIn.swift at 0632361; a reworded message must fail this flow.
appId: ${APP_ID}
tags: [TC-ACC-021, p0]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
# The Account screen's email button carries `signin.emailEntry`; inside the sheet the field is `signin.email`.
- tapOn:
    id: "signin.emailEntry"
- assertVisible:
    id: "signin.password"
- tapOn:
    id: "signin.submit"
# One message per empty field...
- assertVisible: "Enter a valid email address, like name@example.com"
- assertVisible: "Enter your password"
# The shared notice card is deliberately suppressed while the fields carry their own messages
# (SignIn.swift `serverErrorCard`: "the per-field messages own the empty-form case"), so the tap is
# answered once, in place, and not twice.
- assertNotVisible:
    id: "signin.error"
# The sheet must stay open: a refused submit is not a dismissal.
- assertVisible:
    id: "signin.submit"
- assertVisible:
    id: "signin.email"
