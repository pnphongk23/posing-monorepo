# TC-PAY-013 a cancelled purchase grants nothing and reports nothing
#
# Same Test Store harness as TC-PAY-012, with the dialog's Cancel. Cancelling is the user's own answer to
# the store sheet, so the surface stays silent on purpose (Feature, 821bd71): no outcome banner, no card,
# no retry — a "purchase cancelled" error would be scolding the user for a decision they just made. What
# must hold is the *state*: no access, and the paywall is still the surface.
appId: ${APP_ID}
tags: [TC-PAY-013, p1, e2e]
---
- runFlow: ../subflows/pay-launch.yaml
# Account B: unentitled, and not turned entitled by an earlier TC-PAY-004 in the same suite run.
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Cancel"
# Silence is the expectation: give the surface a moment to settle, then assert the *absence* of the
# failure affordances that TC-PAY-012 proves do exist when a purchase really fails.
- extendedWaitUntil:
    notVisible: "Test failed purchase"
    timeout: 30000
- assertNotVisible:
    id: "paywall.status"
- assertNotVisible:
    id: "paywall.retry"
# No access was granted: still on the paywall, camera not behind it …
- assertNotVisible:
    id: "camera.shutter"
# … and the offer is intact, so the user can simply try again when they choose to.
- assertVisible:
    id: "paywall.cta"
- tapOn:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
