# TC-PAY-013 a cancelled purchase grants nothing and is reported, not punished
#
# Same Test Store harness as TC-PAY-012, with the dialog's Cancel. Paywall C writes the outcome on the status
# line ("Purchase cancelled. No access was granted.") but shows NO error card and NO retry: the user answered
# their own store sheet, so there is nothing to retry and nothing to scold. What must also hold is the state:
# no access, and the offer intact.
appId: ${APP_ID}
tags: [TC-PAY-013, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL_B != null && E2E_EMAIL_B.length > 0 && E2E_PASSWORD_B != null && E2E_PASSWORD_B.length > 0}
    label: "E2E_EMAIL_B / E2E_PASSWORD_B missing - this flow needs the second, never-entitled account"
- runFlow: ../subflows/pay-launch.yaml
- runFlow:
    file: ../subflows/pay-sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL_B}
      E2E_PASSWORD: ${E2E_PASSWORD_B}
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Cancel"
# Reported …
- extendedWaitUntil:
    visible:
      id: "paywall.status"
    timeout: 60000
- assertVisible:
    id: "paywall.status"
    text: '.*Purchase cancelled. No access was granted.*'
# … and not punished: no error card, no retry of either kind.
- assertNotVisible:
    id: "paywall.notice"
- assertNotVisible:
    id: "paywall.retry"
- assertNotVisible:
    id: "paywall.offer.retry"
# No access was granted: still on the cover, camera not behind it, offer intact.
- assertNotVisible:
    id: "camera.shutter"
- assertVisible:
    id: "paywall.cta"
- assertVisible: "Unlock the pose camera"
- tapOn:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
