# TC-PAY-013 a cancelled purchase grants nothing and says so
#
# Same Test Store harness as TC-PAY-012, with the dialog's Cancel: the app must report the cancellation
# and keep the paywall up, and the capture gate must still be closed afterwards.
appId: ${APP_ID}
tags: [TC-PAY-013, p1, e2e]
---
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/pay-sign-in.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 30000
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "paywall.status"
    timeout: 60000
- assertVisible:
    id: "paywall.status"
    text: ".*[Cc]ancel.*"
- assertNotVisible:
    id: "camera.shutter"
- tapOn:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
