# TC-SAV-004 empty Saved explains itself and offers Browse poses
#
# Precondition: the E2E account has nothing saved. Clearing it beforehand is a manual step (or use a
# dedicated empty account) — the flow asserts the state, it does not create it, because "unsave
# everything" through the UI is exactly the feature under test elsewhere.
appId: ${APP_ID}
tags: [TC-SAV-004, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/pay-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- tapOn:
    id: "settings.saved.row"
# Setup, not the assertion: whatever this account has saved is removed first (server-confirmed unsaves),
# so the empty state is reached deterministically instead of depending on run order. Bounded to avoid an
# unbounded loop if the control ever stops disappearing.
- repeat:
    times: 10
    commands:
      # `optional` makes this "up to 10 unsaves": once no unsave control is left the tap is skipped, so the
      # loop cannot spin, and the empty-state assertion below is still the real pass/fail.
      - tapOn:
          text: "Remove from saved"
          optional: true
- extendedWaitUntil:
    visible:
      id: "saved.browseCommunity"
    timeout: 25000
- assertVisible: "No saved poses yet"
- assertNotVisible:
    id: "saved.retry"
# The action returns to where the user can find a pose to keep.
- tapOn:
    id: "saved.browseCommunity"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 15000
