# TC-GAL-010 an empty gallery offers the camera, an empty filter does not
appId: ${APP_ID}
tags: [TC-GAL-010, p0]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "Gallery"  # TODO(QA-261029-ID) dock.gallery
- extendedWaitUntil:
    visible:
      id: "gallery.title"
    timeout: 20000
# No photos at all: the empty panel is the recovery, and its one action opens the camera.
- assertVisible:
    id: "gallery.empty.openCamera"
- assertVisible:
    id: "gallery.empty.openCameraButton"
# The chip row is All / Starred only — design-sync (70d38cfe) replaced the time windows, so there is
# no `gallery.filter.today` / `.week` any more. The chips stay on screen in every state.
- assertVisible:
    id: "gallery.filter.all"
- assertVisible:
    id: "gallery.filter.starred"
# Starred with nothing starred is a different state: it explains the filter and never offers the camera.
- tapOn:
    id: "gallery.filter.starred"
- assertVisible:
    id: "gallery.empty.filter"
- assertNotVisible:
    id: "gallery.empty.openCamera"
# Its own action is one way out: "Show all photos" flips the filter back to All.
- assertVisible:
    id: "gallery.empty.showAllPhotos"
- tapOn:
    id: "gallery.empty.showAllPhotos"
- assertVisible:
    id: "gallery.empty.openCamera"
- assertVisible:
    id: "gallery.empty.openCameraButton"
# …and the chips stay interactive, which is the other way out.
- tapOn:
    id: "gallery.filter.starred"
- assertVisible:
    id: "gallery.empty.filter"
- tapOn:
    id: "gallery.filter.all"
- assertVisible:
    id: "gallery.empty.openCamera"
- assertVisible:
    id: "gallery.empty.openCameraButton"
