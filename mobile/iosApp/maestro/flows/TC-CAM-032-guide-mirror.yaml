# TC-CAM-032 the Mirror row flips the pose GUIDE only, and says so in words
appId: ${APP_ID}
tags: [TC-CAM-032, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
- tapOn:
    id: "camera.tools"
- assertVisible:
    id: "camera.tools.mirror"
- assertVisible: "Mirror pose guide"
- assertVisible:
    id: "camera.tools.mirror.switch"
# Off by default; the switch reports its own state as a word, not only a colour.
- assertVisible: "Normal"
- tapOn:
    id: "camera.tools.mirror.switch"
- assertVisible: "Mirrored"
# The guide is still drawn (mirrored, not removed) and the camera itself is untouched.
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.shutter"
# Back to Normal, then close the panel.
- tapOn:
    id: "camera.tools.mirror.switch"
- assertVisible: "Normal"
- tapOn:
    point: "20%,45%"
- assertNotVisible:
    id: "camera.tools.mirror"
- assertVisible:
    id: "camera.poseGuide"
# `camera.pickerStripToggle` used to be asserted here; it is in `retiredIdentifiers` (CameraFeature.swift:1813-1817)
# — the strip was replaced by the pose-picker sheet — so the assertion was removed rather than the case, whose
# subject (the Mirror row flipping the guide only) still exists and still passes.
