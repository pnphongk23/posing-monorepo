# TC-CAM-032 the guide's Mirror control flips the pose GUIDE only, and says so in words
appId: ${APP_ID}
tags: [TC-CAM-032, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
# Build 23 moved every guide control out of the tools popover and into the guide-adjust sheet. The sheet is opened
# through the **visible** eye in the top chrome — `camera.guideToggle`, label "Adjust guide" (owner decision
# 2026-11-08; read at `feat/design-sync-1108`, 70d38cfe: `topControls` → `model.openGuideAdjust()`) — never by tapping
# the pose reference, which is the hidden route that let this surface regress unnoticed.
- assertVisible:
    id: "camera.guideToggle"
- assertVisible: '.*Adjust guide.*'
- tapOn:
    id: "camera.guideToggle"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.guideAdjust.opacity"
- assertVisible:
    id: "camera.guideAdjust.scale"
- assertVisible:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.lineColor.white"
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
# The retired popover controls must not exist on either surface.
- assertNotVisible:
    id: "camera.tools.mirror"
- assertNotVisible:
    id: "camera.tools.mirror.switch"
# Off by default; the control reports its own state as a word, not only a colour. The label stays
# "Mirror guide" and the VALUE flips "Normal" ⇄ "Mirrored" (CameraGuideAdjust.swift `Layout.flipIdentifier`).
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Normal.*'
- tapOn:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
# The guide is still drawn (mirrored, not removed) and the camera itself is untouched.
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.shutter"
# Back to Normal, then close the sheet with its own control.
- tapOn:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Normal.*'
- tapOn:
    id: "camera.guideAdjust.done"
- extendedWaitUntil:
    notVisible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.poseGuide"
