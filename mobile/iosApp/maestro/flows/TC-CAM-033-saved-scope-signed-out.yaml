# TC-CAM-033 signed out, the Saved scope asks for a sign-in instead of showing rows
appId: ${APP_ID}
tags: [TC-CAM-033, p1]
---
# Signed out is the clean-launch state, so this flow is credential-free and is NOT e2e-tagged: it must never be
# skipped for "needs E2E_EMAIL".
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- runFlow: ../subflows/camera-open-picker.yaml
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.saved"
    timeout: 15000
- tapOn:
    id: "posePicker.scope.saved"
- extendedWaitUntil:
    visible:
      id: "posePicker.saved.signIn"
    timeout: 20000
# The Saved screen's own sign-in copy, and no pose rows underneath it.
- assertVisible: '.*Sign in to view your saved poses.*'
- assertVisible: '.*Your saved poses are tied to your account.*'
- assertNotVisible:
    id: "posePicker.grid"
- takeScreenshot: saved-scope-signed-out
# Signed out never blocks the catalogue: All still lists poses.
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.all"
    timeout: 15000
- tapOn:
    id: "posePicker.scope.all"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
- tapOn:
    id: "posePicker.close"
- assertVisible:
    id: "camera.shutter"
