# TC-CAM-033 signed out, the Saved scope asks for a sign-in instead of showing rows or an error
appId: ${APP_ID}
tags: [TC-CAM-033, p1]
---
# Signed out is the clean-launch state, so this flow is credential-free and is NOT e2e-tagged: it must
# never be skipped for "needs E2E_EMAIL" (a pass-5 run classified it that way, which is wrong — check the
# runner, not this file).
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# `camera.choosePose` is the strip's Browse card since d001b80 — the strip opens expanded, so the card is
# on screen; the tap still opens the full picker sheet (search + All/Saved).
- assertVisible:
    id: "camera.poseStrip"
# The Browse card is the strip's last card and only exists once the catalogue has loaded.
- extendedWaitUntil:
    visible:
      id: "camera.choosePose"
    timeout: 20000
- tapOn:
    id: "camera.choosePose"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
# `posePicker.scope.saved` has no condition in source — the chips sit above the search field whenever the
# sheet is open (CameraFeature.swift, panel: handle → header → scopeChips → searchField → content). It was
# simply not waited for: the sheet still animates in when the grid first reports visible, so tapping
# straight away raced the animation. Wait for the chip itself.
- assertVisible:
    id: "posePicker.scope"
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.saved"
    timeout: 15000
- tapOn:
    id: "posePicker.scope.saved"
- extendedWaitUntil:
    visible:
      id: "posePicker.saved.signIn"
    timeout: 20000
# The Saved screen's own sign-in copy, and no pose rows underneath it.
- assertVisible: "Sign in to view your saved poses"
- assertVisible: "Your saved poses are tied to your account. Sign in to keep them synced."
- assertNotVisible:
    id: "posePicker.grid"
# Signed out never blocks the catalogue: All still lists poses.
- extendedWaitUntil:
    visible:
      id: "posePicker.scope.all"
    timeout: 15000
- tapOn:
    id: "posePicker.scope.all"
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
- tapOn:
    id: "posePicker.close"
- assertVisible:
    id: "camera.shutter"
