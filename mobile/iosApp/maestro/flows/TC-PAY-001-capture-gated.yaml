# TC-PAY-001 capture with the paywall on and signed out opens the paywall
#
# Build 21 compacted the surface: hero, X, headline, the three one-line steps, BOTH plan cards, the auto-renew
# sentence and the dock (account line → CTA → legal row) fit one screen, and the selected-plan summary line was
# removed. So what this case asserts is the structure of the signed-out surface, with the paid step reached by
# scrolling when the device is shorter than the layout assumes — never assumed to be on screen.
appId: ${APP_ID}
tags: [TC-PAY-001, p0]
---
- runFlow:
    file: ../subflows/launch-paywall.yaml
    env:
      PAYWALL: "YES"
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
# The X is asserted first: it lives on the first frame and is the only way out of the cover.
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 20000
- assertVisible:
    id: "paywall.steps"
# The paid step carries the only benefit Premium claims. It sits inside the steps block, which can end up
# below the fold, so its presence is proven by scrolling to it.
- scrollUntilVisible:
    element:
      id: "paywall.benefit"
    direction: DOWN
    timeout: 15000
# Build 21: both cards are on the first screen, each stating its own amount and period.
- assertVisible:
    id: "paywall.plan.annual"
- assertVisible:
    id: "paywall.plan.monthly"
- assertVisible:
    id: "paywall.disclosure.autoRenew"
    text: '.*Renews automatically until you cancel in Apple ID settings.*'
# Signed out, the line above the CTA is about the account (build 21 removed the selected-plan summary).
- assertVisible:
    id: "paywall.account.status"
    text: '.*Sign in first so Premium follows you.*'
# The legal row travels in the dock with the purchase region.
- assertVisible:
    id: "paywall.restore"
- assertVisible:
    id: "paywall.terms"
- assertVisible:
    id: "paywall.privacy"
- assertVisible: "Sign in to subscribe"
