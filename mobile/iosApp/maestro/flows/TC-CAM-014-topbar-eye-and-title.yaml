# TC-CAM-014 the top bar: Close · eye · tools, and the Poses chip is the only way into the picker
appId: ${APP_ID}
tags: [TC-CAM-014, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# No pose pill in the bar and no eye while no pose is chosen.
- assertVisible:
    id: "camera.close"
- assertVisible:
    id: "camera.tools"
- assertNotVisible:
    id: "camera.guideToggle"
# The Poses chip on the scale row opens the sheet (it replaced the strip's Browse card).
- runFlow: ../subflows/camera-open-picker.yaml
- extendedWaitUntil:
    visible:
      id: "posePicker.grid"
    timeout: 20000
# Rows carry only their VoiceOver label ("Use <name> pose"), so the first one is chosen by that label's shape,
# never by a screen coordinate.
- tapOn: '.*Use .* pose.*'
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 15000
- assertNotVisible:
    id: "posePicker.sheet"
# A pose is chosen, so the eye appears and owns the guide's visibility — its label is the action.
- assertVisible:
    id: "camera.guideToggle"
- assertVisible: '.*Hide pose guide.*'
- tapOn:
    id: "camera.guideToggle"
- assertNotVisible:
    id: "camera.poseGuide"
- assertVisible: '.*Show pose guide.*'
- tapOn:
    id: "camera.guideToggle"
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.choosePose"
- takeScreenshot: topbar-pose-applied
