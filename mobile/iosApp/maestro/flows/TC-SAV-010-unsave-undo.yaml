# TC-SAV-010 unsave is server-confirmed and reversible: "Removed <pose>" + Undo puts the row back
#
# The snackbar has no id of its own (by design), so the flow reads it by its text — "Undo" and the
# "Removed …" line — and proves the recovery, not just the message: the pose that was there first is the
# first row again after Undo, i.e. it returned to its previous index through the real bookmark service.
#
# Needs an account with at least two saved poses (TC-SAV-002 leaves one; seed a second by saving another
# pose before this flow, or run it against an account that already has some).
appId: ${APP_ID}
tags: [TC-SAV-010, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/pay-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- tapOn:
    id: "settings.saved.row"
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 30000
# Remember what the first row is, so "restored at its previous index" is checkable.
- copyTextFrom:
    id: "poses.first-card"
# The first row's unsave control (the only "Remove from saved" on screen at that position).
- tapOn: "Remove from saved"
- extendedWaitUntil:
    visible: "Removed .*"
    timeout: 15000
- assertVisible: "Undo"
# The row is gone from the list while the offer to restore it is up.
- assertNotVisible:
    text: ${maestro.copiedText}
    below:
      id: "saved.back"
# Undo restores it — the same pose, back at the top.
- tapOn: "Undo"
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 20000
- assertVisible:
    id: "poses.first-card"
    text: ${maestro.copiedText}
- assertNotVisible: "Undo"
# Still the Saved list (nothing navigated away), and not an empty or failed state.
- assertNotVisible:
    id: "saved.browseCommunity"
- assertNotVisible:
    id: "saved.retry"
