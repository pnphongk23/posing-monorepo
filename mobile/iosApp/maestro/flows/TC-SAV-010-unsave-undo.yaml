# TC-SAV-010 unsave is server-confirmed and reversible: "Removed <pose>" + Undo puts the row back
#
# Ids are authoritative (0df8024): the row tile is `saved.unsave.<poseID>`, the bar `saved.snackbar` and the
# reversible offer `saved.snackbar.undo`.
#
# The removal is server-confirmed before the row leaves the list (PosesFeature.swift:583-616), so the gap
# between the tap and the bar is a network round trip, not an animation: a 4 s bound was a test defect, not a
# product one. The wait is 15 s and the bar's own ~4 s life (APSnackbar.swift:24) starts when it appears, so
# the Undo tap is the very next command. The measured latency is printed into the Maestro log as
# SNACKBAR_LATENCY_MS so a slow server is visible in the evidence instead of being guessed at.
#
# Needs an account with at least two saved poses (TC-SAV-002 leaves one; seed a second by saving another
# pose before this flow, or run it against an account that already has some).
appId: ${APP_ID}
tags: [TC-SAV-010, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/pay-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- tapOn:
    id: "settings.saved.row"
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 30000
# Remember what the first row is, so "restored at its previous index" is checkable.
- copyTextFrom:
    id: "poses.first-card"
# The first row's unsave tile, by id — not by the shared "Remove from saved" label.
- evalScript: ${output.unsaveT0 = Date.now()}
- tapOn:
    id: 'saved\.unsave\..*'
    index: 0
# Server-confirmed removal: allow a slow round trip, the bar's own life only starts once it is up.
- extendedWaitUntil:
    visible:
      id: "saved.snackbar"
    timeout: 15000
- evalScript: ${console.log("SNACKBAR_LATENCY_MS=" + (Date.now() - output.unsaveT0))}
# The row is gone from the list while the offer to restore it is up. One hierarchy read, deliberately
# before the tap: the bar only lives ~4 s, so nothing slow may sit between the wait and the Undo tap.
- assertNotVisible:
    text: ${maestro.copiedText}
    below:
      id: "saved.back"
# Tapping the Undo id both acts and proves only the reversible offer carries it.
- tapOn:
    id: "saved.snackbar.undo"
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 20000
- assertVisible:
    id: "poses.first-card"
    text: ${maestro.copiedText}
- assertNotVisible:
    id: "saved.snackbar.undo"
# Still the Saved list (nothing navigated away), and not an empty or failed state.
- assertNotVisible:
    id: "saved.browseCommunity"
- assertNotVisible:
    id: "saved.retry"
