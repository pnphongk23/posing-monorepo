# TC-CAM-041 the guide settings are reachable through a VISIBLE control, and they persist
#
# Why this case exists: after the guide controls moved out of the tools popover, the only way into the adjust
# sheet was tapping the pose reference — a control with no visible affordance. TC-CAM-015/032 were re-pointed at
# retired ids, so both kept passing while the settings were effectively unreachable for a user. This flow therefore
# opens the sheet ONLY through the visible top-chrome control, and never by tapping the guide.
#
# Owner decision (2026-11-08, final): the entry point is the **eye** button in the top chrome. A separate
# `camera.guideAdjust.open` button and the sheet's Reset row were REMOVED; showing/hiding the guide is the
# "Show guide" toggle at the top of the sheet. There is no long press. Both retired ids are guarded below.
#
# Verified against `feat/design-sync-1108` (70d38cfe):
#   camera.guideToggle        CameraFeature.swift `topControls`: glyph `eye`, accessibilityLabel "Adjust guide",
#                             value "Open guide settings" / "Unavailable. Choose a pose first", action
#                             `model.openGuideAdjust()`. Always drawn (dimmed + disabled when no guide), so the
#                             sheet has a visible entry point at all times.
#   camera.guideAdjust        CameraGuideAdjust.swift `CameraGuideAdjustSheet.Layout.sheetIdentifier` — the sheet
#                             container (in-place overlay, not a modal sheet, so the camera stays live behind it).
#   camera.guideAdjust.showGuide  the "Show guide" toggle in the sheet's first row — `isPoseGuideVisible`.
#   camera.poseGuide          CameraCanvas.swift: drawn only while a guide exists AND `isPoseGuideVisible`, so it is
#                             the proof that the Show guide toggle hid and re-showed the reference.
#   line colour               `GuideLineColor` is **black | white only** (`camera.guideAdjust.lineColor.black|white`,
#                             that order), **white is the default**, and a legacy stored pink/yellow/green loads as
#                             white (`GuideLineColor.stored`). A swatch exposes value "Selected" when chosen.
#   scale / flip / opacity    scale value reads "NN%" ("100%" at the default); flip is a button labelled
#                             "Mirror guide" whose value flips "Normal" ⇄ "Mirrored"; opacity reads "NN%".
#   persistence               `CameraSettings` carries opacity, flipped, lineColor and the guide transform, so they
#                             survive a relaunch. Seeding a legacy colour is NOT possible from a flow (no launch-arg
#                             hook for camera settings; the snapshot is one UserDefaults JSON blob) — that upgrade
#                             check is a device step in docs/qa/camera-device-checklist.md.
appId: ${APP_ID}
tags: [TC-CAM-041, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# A guide has to exist before its controls mean anything.
- runFlow: ../subflows/camera-open-picker.yaml
- tapOn: '.*Use .* pose.*'
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
# The point of the case: the affordance is on screen, with its own label, before anything is opened.
- assertVisible:
    id: "camera.guideToggle"
- assertVisible: '.*Adjust guide.*'
- assertVisible: '.*Open guide settings.*'
- tapOn:
    id: "camera.guideToggle"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
# The sheet's controls, in board order: visibility first, then opacity · scale · line colour + mirror, one Done.
- assertVisible:
    id: "camera.guideAdjust.showGuide"
- assertVisible:
    id: "camera.guideAdjust.opacity"
- assertVisible:
    id: "camera.guideAdjust.scale"
- assertVisible:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
- assertVisible:
    id: "camera.guideAdjust.lineColor.white"
- assertVisible:
    id: "camera.guideAdjust.done"
# Owner decision: no separate open button on the camera, no Reset row in the sheet. Both must stay retired.
- assertNotVisible:
    id: "camera.guideAdjust.open"
- assertNotVisible:
    id: "camera.guideAdjust.reset"
# 1. The default is WHITE and nothing else is offered; flip starts Normal, scale 100 %.
- assertVisible:
    id: "camera.guideAdjust.lineColor.white"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: ''
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Normal.*'
- assertVisible:
    id: "camera.guideAdjust.scale"
    text: '.*100%.*'
# Retired surfaces must not come back (cheap, and this is exactly what let the regression hide).
- assertNotVisible:
    id: "camera.tools.poseGuide"
- assertNotVisible:
    id: "camera.tools.mirror"
- assertNotVisible:
    id: "camera.tools.opacity"
- assertNotVisible:
    id: "camera.tools.scale"
- assertNotVisible:
    id: "camera.tools.lineColor.black"
# 2. The eye no longer hides the guide — the sheet's "Show guide" toggle does, and it draws the reference back.
- tapOn:
    id: "camera.guideAdjust.showGuide"
- extendedWaitUntil:
    notVisible:
      id: "camera.poseGuide"
    timeout: 15000
- tapOn:
    id: "camera.guideAdjust.showGuide"
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 15000
# 3. Pick black, mirror the guide, close with Done.
- tapOn:
    id: "camera.guideAdjust.lineColor.black"
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- tapOn:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- tapOn:
    id: "camera.guideAdjust.done"
- extendedWaitUntil:
    notVisible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.poseGuide"
# 4. Re-open through the same visible button: the settings survived the sheet being dismissed.
- tapOn:
    id: "camera.guideToggle"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- tapOn:
    id: "camera.guideAdjust.done"
- extendedWaitUntil:
    notVisible:
      id: "camera.guideAdjust"
    timeout: 15000
# 5. Persistence across a relaunch WITHOUT clearState: these settings live in the CameraSettings snapshot, and
#    the remembered pose brings the guide (and therefore the eye) back.
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-camera.yaml
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
- tapOn:
    id: "camera.guideToggle"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- assertVisible:
    id: "camera.guideAdjust.opacity"
    text: '.*%.*'
- tapOn:
    id: "camera.guideAdjust.done"
- assertVisible:
    id: "camera.poseGuide"
