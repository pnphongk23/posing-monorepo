# TC-CAM-041 the guide settings are reachable through a VISIBLE control, and they persist
#
# Why this case exists: after the guide controls moved out of the tools popover, the only way into the adjust
# sheet was tapping the pose reference — a control with no visible affordance. TC-CAM-015/032 were re-pointed at
# retired ids, so both kept passing while the settings were effectively unreachable for a user. This flow therefore
# opens the sheet ONLY through the visible top-chrome button, and never by tapping the guide.
#
# Verified against `fix/camera-guide-settings` (da2fccc):
#   camera.guideAdjust.open   CameraSurfaceControl, glyph `figure.stand`, accessibilityLabel "Adjust guide", drawn in
#                             the top chrome while a guide exists AND is visible, disabled when the controls are
#   camera.guideAdjust.reset  the sheet's Reset row, wired to `resetGuideTransform()`
#   line colour               `GuideLineColor` is **black | white only** (`camera.guideAdjust.lineColor.black|white`,
#                             that order), **white is the default**, and a legacy stored pink/yellow/green loads as
#                             white (`GuideLineColor.stored`). A swatch exposes value "Selected" when chosen.
#   scale / flip / opacity    scale value reads "NN%" ("100%" at the default), flip label flips
#                             "Mirror pose guide" ⇄ "Unmirror pose guide" with value "Mirrored"/"Normal", opacity
#                             reads "NN%"
#   Reset                     restores the guide TRANSFORM only (scale/rotation/offset) — colour and flip are kept
#   persistence               `CameraSettings` carries opacity, flipped, lineColor and transform, so they survive a
#                             relaunch. Seeding a legacy colour is NOT possible from a flow (no launch-arg hook for
#                             camera settings; the snapshot is one UserDefaults JSON blob) — that upgrade check is a
#                             device step in docs/qa/camera-device-checklist.md.
appId: ${APP_ID}
tags: [TC-CAM-041, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# A guide has to exist before its controls mean anything.
- runFlow: ../subflows/camera-open-picker.yaml
- tapOn: '.*Use .* pose.*'
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
# The point of the case: the affordance is on screen, with its own label, before anything is opened.
- assertVisible:
    id: "camera.guideAdjust.open"
- assertVisible: '.*Adjust guide.*'
- tapOn:
    id: "camera.guideAdjust.open"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
# The sheet's controls: colour is black-or-white only, plus the Reset row.
- assertVisible:
    id: "camera.guideAdjust.opacity"
- assertVisible:
    id: "camera.guideAdjust.scale"
- assertVisible:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
- assertVisible:
    id: "camera.guideAdjust.lineColor.white"
- assertVisible:
    id: "camera.guideAdjust.reset"
- assertVisible:
    id: "camera.guideAdjust.done"
# 1. The default is WHITE and nothing else is offered.
- assertVisible:
    id: "camera.guideAdjust.lineColor.white"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: ''
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Normal.*'
- assertVisible:
    id: "camera.guideAdjust.scale"
    text: '.*100%.*'
# Retired surfaces must not come back (cheap, and this is exactly what let the regression hide).
- assertNotVisible:
    id: "camera.tools.poseGuide"
- assertNotVisible:
    id: "camera.tools.mirror"
- assertNotVisible:
    id: "camera.tools.opacity"
- assertNotVisible:
    id: "camera.tools.scale"
- assertNotVisible:
    id: "camera.tools.lineColor.black"
# 2. Pick black, mirror the guide, close with Done.
- tapOn:
    id: "camera.guideAdjust.lineColor.black"
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- tapOn:
    id: "camera.guideAdjust.flip"
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- assertVisible: '.*Unmirror pose guide.*'
- tapOn:
    id: "camera.guideAdjust.done"
- extendedWaitUntil:
    notVisible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.poseGuide"
# 3. Re-open through the same visible button: the settings survived the sheet being dismissed.
- assertVisible:
    id: "camera.guideAdjust.open"
- tapOn:
    id: "camera.guideAdjust.open"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
# 4. Reset restores the guide's transform (source: `resetGuideTransform()` → scale 100 %, no rotation, no offset);
#    the sheet exposes the scale as a value, and every offset is 0 again — colour and flip are NOT reset.
- tapOn:
    id: "camera.guideAdjust.reset"
- assertVisible:
    id: "camera.guideAdjust.scale"
    text: '.*100%.*'
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- tapOn:
    id: "camera.guideAdjust.done"
- extendedWaitUntil:
    notVisible:
      id: "camera.guideAdjust"
    timeout: 15000
# 5. Persistence across a relaunch WITHOUT clearState: these four settings live in the CameraSettings snapshot.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
- runFlow: ../subflows/open-camera.yaml
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust.open"
    timeout: 20000
- tapOn:
    id: "camera.guideAdjust.open"
- extendedWaitUntil:
    visible:
      id: "camera.guideAdjust"
    timeout: 15000
- assertVisible:
    id: "camera.guideAdjust.lineColor.black"
    text: '.*Selected.*'
- assertVisible:
    id: "camera.guideAdjust.flip"
    text: '.*Mirrored.*'
- assertVisible:
    id: "camera.guideAdjust.opacity"
    text: '.*%.*'
- tapOn:
    id: "camera.guideAdjust.done"
- assertVisible:
    id: "camera.poseGuide"
