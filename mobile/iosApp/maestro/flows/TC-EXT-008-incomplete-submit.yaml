# TC-EXT-008 incomplete submit teaches instead of uploading
appId: ${APP_ID}
tags: [TC-EXT-008, p0, e2e]
---
- runFlow: ../subflows/rd-launch.yaml
- runFlow: ../subflows/rd-sign-in.yaml
- tapOn:
    id: "poses.add-pose"
- extendedWaitUntil:
    visible:
      id: "addPose.submitButton"
    timeout: 15000
# The CTA stays tappable and the form says what is missing before any tap.
- assertVisible:
    id: "addPose.submitHint"
- assertVisible: "Choose a photo to continue."
# Tapping with no photo opens the picker (1.1 (17) behaviour) instead of uploading anything.
- tapOn:
    id: "addPose.submitButton"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 20000
- assertNotVisible:
    id: "addPose.consent.message"
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "addPose.submitButton"
    timeout: 15000
- assertVisible:
    id: "addPose.submitHint"
- assertNotVisible:
    id: "addPose.consent.message"
