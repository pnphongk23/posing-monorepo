# TC-SET-001 settings rows; About opens and closes
appId: ${APP_ID}
tags: [TC-SET-001, p0]
---
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: "poses.open-settings"
- assertVisible: "Privacy"  # TODO(QA-261029-ID) settings.privacy.section
- assertVisible: "Replay onboarding guide"  # TODO(QA-261029-ID) settings.replayOnboarding
- tapOn: "About posing.*"  # TODO(QA-261029-ID) settings.about
- assertVisible:
    id: "about.close"
- tapOn:
    id: "about.close"
- assertVisible: "Privacy"  # TODO(QA-261029-ID) settings.privacy.section
