- tapOn: "About posing.*"  # TODO(QA-261029-ID) settings.about
- assertVisible: "Strike the pose. Snap the moment."
- tapOn: "Close About posing"  # TODO(QA-261029-ID) about.close
- assertVisible: "Privacy"
