# TC-PAY-009 the signed-out paywall offers Sign in with Apple first, then Google and email
appId: ${APP_ID}
tags: [TC-PAY-009, p1]
---
# Signed out with the paywall on: `pay-launch` enables the Debug switches and never signs in.
- runFlow: ../subflows/pay-launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
# The options are not on the paywall body: the signed-out CTA ("Sign in to subscribe") opens the sign-in
# sheet, and only then is there an order to check. Tapping it is part of the case, not setup.
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 20000
- tapOn:
    id: "paywall.cta"
- extendedWaitUntil:
    visible:
      id: "paywall.signin.sheet"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "paywall.signin.apple"
    timeout: 15000
# Apple is first in the column, so Google (its peer) sits below it, and email below that. This is the
# ordering half of guideline 4.8; "equal prominence" is geometry (system Apple button + shared styling,
# pinned by PaywallAppleSignInTests), which no Maestro selector can measure.
- assertVisible:
    id: "paywall.signin"
    below:
      id: "paywall.signin.apple"
- assertVisible:
    id: "signin.emailEntry"
    below:
      id: "paywall.signin"
# The sheet is dismissible back to the offer without signing in or buying.
- tapOn:
    id: "paywall.signin.close"
- assertNotVisible:
    id: "paywall.signin.sheet"
