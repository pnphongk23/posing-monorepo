# TC-CAM-001 Use this pose opens the camera with the guide drawn and its controls
appId: ${APP_ID}
tags: [TC-CAM-001, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.shutter"
    timeout: 20000
- assertVisible:
    id: "camera.choosePose"
- assertVisible:
    id: "camera.poseGuide"
