# TC-CAM-001 Use this pose opens the camera with the guide drawn and its controls
appId: ${APP_ID}
tags: [TC-CAM-001, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.shutter"
    timeout: 20000
# The Browse card is the strip's last card and only exists once the catalogue has loaded, so wait for
# it instead of assuming it: a clean launch may still be showing skeleton cards.
- extendedWaitUntil:
    visible:
      id: "camera.choosePose"
    timeout: 20000
- assertVisible:
    id: "camera.poseGuide"
