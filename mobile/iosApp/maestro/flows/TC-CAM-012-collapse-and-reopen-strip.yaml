# TC-CAM-012 the strip collapses behind one control and reopens from it
appId: ${APP_ID}
tags: [TC-CAM-012, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
# A clean install opens expanded: the strip is on screen and one control owns both states.
- assertVisible:
    id: "camera.pickerStripToggle"
- assertVisible:
    id: "camera.poseStrip"
# The control names the action it will take: "Hide pose picker" while the strip is open.
- assertVisible: "Hide pose picker"
# 1. Collapse. The strip goes, the control that hid it does not.
- tapOn:
    id: "camera.pickerStripToggle"
- assertNotVisible:
    id: "camera.poseStrip"
- assertVisible:
    id: "camera.pickerStripToggle"
# The label flips with the state, so the way back is never a hidden gesture.
- assertVisible: "Show pose picker"
- assertNotVisible: "Hide pose picker"
# 2. Collapsed is exactly thumbnail · shutter · flip on the bar…
- assertVisible:
    id: "camera.gallery"
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.flip"
# …and the top chrome does not move while the strip is gone.
- assertVisible:
    id: "camera.close"
- assertVisible:
    id: "camera.tools"
# 3. The same control re-opens it.
- tapOn:
    id: "camera.pickerStripToggle"
- assertVisible:
    id: "camera.poseStrip"
- assertVisible:
    id: "camera.shutter"
- assertVisible: "Hide pose picker"
- assertVisible:
    id: "camera.pickerStripToggle"
