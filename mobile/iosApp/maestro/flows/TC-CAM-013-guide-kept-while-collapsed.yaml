# TC-CAM-013 collapsing the strip never hides the pose guide
# OBSOLETE ON MERGE of feat/camera-pose-popup: the inline strip (and its collapsed state) is gone, so this
# flow describes a screen that no longer exists. Kept — not deleted — until the branch merges, and it WILL FAIL on
# that build: `run.sh` excludes only the `e2e` tag, so `obsolete-on-merge` is a marker for humans, not a filter.
appId: ${APP_ID}
tags: [TC-CAM-013, obsolete-on-merge, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
# A pose is chosen, so the guide's own eye control exists — that is what stays in charge of the guide.
- assertVisible:
    id: "camera.guideToggle"
# Collapse: the strip goes away, the guide does not.
- tapOn:
    id: "camera.pickerStripToggle"
- assertNotVisible:
    id: "camera.poseStrip"
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.guideToggle"
# Re-open: still the same guide on screen (which pose it is, is CAM-007/CAM-011's job).
- tapOn:
    id: "camera.pickerStripToggle"
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.pickerStripToggle"
