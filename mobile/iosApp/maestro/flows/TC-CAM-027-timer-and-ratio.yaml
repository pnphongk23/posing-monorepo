# TC-CAM-027 the tools popover's Timer and Ratio rows set a value and keep it
appId: ${APP_ID}
tags: [TC-CAM-027, p0]
---
# Timer / Ratio change what a capture does, and the Simulator has no camera: this flow proves the controls, their
# chips and their persistence; the capture itself is device-checklist §5 / §12.
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.tools"
- extendedWaitUntil:
    visible:
      id: "camera.tools.popover"
    timeout: 15000
# Build 23 draws both rows as chip rows, one chip per choice, each with its own id.
- assertVisible:
    id: "camera.tools.timer.off"
- assertVisible:
    id: "camera.tools.timer.3s"
- assertVisible:
    id: "camera.tools.timer.10s"
- assertVisible:
    id: "camera.tools.ratio.3x4"
- assertVisible:
    id: "camera.tools.ratio.1x1"
- assertVisible:
    id: "camera.tools.ratio.9x16"
# Choose a countdown, then a square frame: the popover stays up, so a setting applies without a commit step.
- tapOn:
    id: "camera.tools.timer.3s"
- assertVisible:
    id: "camera.tools.popover"
- tapOn:
    id: "camera.tools.ratio.1x1"
- assertVisible:
    id: "camera.tools.popover"
- tapOn:
    id: "camera.tools.ratio.9x16"
- assertVisible:
    id: "camera.tools.popover"
# Dismissal: the popover closes on its own control or on an outside tap — never on a Done button.
- tapOn:
    point: "20%,45%"
- assertNotVisible:
    id: "camera.tools.popover"
- assertVisible:
    id: "camera.shutter"
# Both settings persist like every other camera setting.
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.tools"
- extendedWaitUntil:
    visible:
      id: "camera.tools.popover"
    timeout: 15000
- assertVisible:
    id: "camera.tools.timer.3s"
- assertVisible:
    id: "camera.tools.ratio.9x16"
