# TC-CAM-015 the tools popover has four rows, no title and no Done
appId: ${APP_ID}
tags: [TC-CAM-015, p1]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- tapOn:
    id: "camera.tools"
# Build 23: the popover is its own container and a setting applies the moment it is tapped — there is no commit
# step and no Done control to press.
- extendedWaitUntil:
    visible:
      id: "camera.tools.popover"
    timeout: 15000
- assertNotVisible:
    id: "camera.tools.done"
# The four rows, with their controls: flash as three chips, the grid switch, timer and ratio as chip rows.
- assertVisible:
    id: "camera.tools.flash.off"
- assertVisible:
    id: "camera.tools.flash.auto"
- assertVisible:
    id: "camera.tools.flash.on"
- assertVisible:
    id: "camera.tools.grid"
- assertVisible:
    id: "camera.tools.timer.off"
- assertVisible:
    id: "camera.tools.timer.3s"
- assertVisible:
    id: "camera.tools.timer.10s"
- assertVisible:
    id: "camera.tools.ratio.3x4"
- assertVisible:
    id: "camera.tools.ratio.1x1"
- assertVisible:
    id: "camera.tools.ratio.9x16"
# The guide's controls left this popover for their own sheet: none of them may appear here any more.
- assertNotVisible:
    id: "camera.tools.poseGuide"
- assertNotVisible:
    id: "camera.tools.mirror"
- assertNotVisible:
    id: "camera.tools.mirror.switch"
- assertNotVisible:
    id: "camera.tools.opacity"
- assertNotVisible:
    id: "camera.tools.scale"
- assertNotVisible:
    id: "camera.tools.lineColor.black"
# Dismissal is the outside tap: the popover goes away and the camera is untouched.
- tapOn:
    point: "20%,45%"
- assertNotVisible:
    id: "camera.tools.popover"
- assertNotVisible:
    id: "camera.tools.flash.off"
- assertVisible:
    id: "camera.close"
- assertVisible:
    id: "camera.shutter"
# Re-open proves the popover really went away and comes back on its rows.
- tapOn:
    id: "camera.tools"
- extendedWaitUntil:
    visible:
      id: "camera.tools.popover"
    timeout: 15000
