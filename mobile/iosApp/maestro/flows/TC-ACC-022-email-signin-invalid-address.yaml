# TC-ACC-022 a malformed email is refused on its own field, locally
# TC-ACC-022 a malformed address is refused locally
appId: ${APP_ID}
tags: [TC-ACC-022, p0]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
- tapOn:
    id: "signin.emailEntry"
- tapOn:
    id: "signin.emailEntry"
- inputText: "maya@"
- tapOn:
    id: "signin.password"
- inputText: "correct horse battery"
- tapOn:
    id: "signin.submit"
# The email field alone carries the problem — the password is fine, so its message must not appear.
- assertVisible: "Enter a valid email address, like name@example.com"
- assertNotVisible: "Enter your password"
# Correcting the address clears the message without leaving the sheet.
- tapOn:
    id: "signin.emailEntry"
- eraseText
- inputText: "maya@example.com"
- assertNotVisible: "Enter a valid email address, like name@example.com"
