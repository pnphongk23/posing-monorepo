# TC-CAM-001 "Use this pose" opens the camera with that pose as guide (Pose guide control present)
appId: posing.camera.app
tags: [p0, smoke]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-first-pose.yaml
- tapOn: "Use this pose"
- extendedWaitUntil:
    visible: "Capture photo"
    timeout: 20000
- assertVisible: "Show camera grid"
- assertVisible: "Choose a pose"
- takeScreenshot: p0-04-camera-guide
