# Open the pose sheet from the Poses chip on the scale row and wait until it is really up.
# Build 18+ (feat/camera-pose-popup): the chip keeps `camera.choosePose`; the sheet has **no container id**,
# so `posePicker.search` (drawn with the sheet's first rows) is the proof it opened.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "camera.choosePose"
    timeout: 20000
- tapOn:
    id: "camera.choosePose"
- extendedWaitUntil:
    visible:
      id: "posePicker.search"
    timeout: 15000
