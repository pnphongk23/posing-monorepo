# Open the pose sheet from the Poses chip on the scale row and wait until it is really up.
# The chip keeps `camera.choosePose`; the sheet exposes its own container (`posePicker.sheet`), which is the
# proof it opened — no need to infer it from one of the children any more.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "camera.choosePose"
    timeout: 20000
- tapOn:
    id: "camera.choosePose"
- extendedWaitUntil:
    visible:
      id: "posePicker.sheet"
    timeout: 15000
