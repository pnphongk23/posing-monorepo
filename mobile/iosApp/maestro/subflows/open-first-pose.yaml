# Wait for the server catalogue, open the first card.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "poses.first-card"
    timeout: 30000
- tapOn:
    id: "poses.first-card"
- scrollUntilVisible:
    element: "Use this pose"  # TODO(QA-261029-ID) poseDetail.use
    timeout: 15000
