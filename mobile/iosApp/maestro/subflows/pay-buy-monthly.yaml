# Buys the Monthly plan from an open paywall through the RevenueCat Test Store dialog. Preconditions:
# paywall on screen, signed in, plans loaded. Ends on the camera: a confirmed entitlement closes the
# sheet by itself (PremiumGate.swift:140-151), so the confirmation banner is deliberately NOT asserted
# here — it can be gone before a selector could read it. Callers assert entitlement where it is stable.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
# Both packages the offering must expose (stage-2 plan cards carry one id per package type, never a
# price), then the Monthly card is picked. Annual is preselected; picking Monthly proves the choice
# reaches the purchase.
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "paywall.plan.annual"
- tapOn:
    id: "paywall.plan.monthly"
# Redesigned build 18: one CTA for every plan, labelled "Subscribe" (it used to read
# "Continue with Monthly"). The plan choice is proven by the card tap above and by the purchase below.
- assertVisible: "Subscribe"
- tapOn:
    id: "paywall.cta"
# Test Store dialog (SDK-owned, in-process): "Test valid purchase" / "Test failed purchase" / "Cancel".
# A purchase that never reaches the store leaves this step waiting, which is the failure we want.
- extendedWaitUntil:
    visible: "Test valid purchase"
    timeout: 30000
- tapOn: "Test valid purchase"
- extendedWaitUntil:
    notVisible: "Test valid purchase"
    timeout: 60000
# Belt and braces: if the sheet is still up (a slower answer than this step), close it so every caller
# continues from the camera. A failed/cancelled purchase keeps the paywall up with its error banner.
- runFlow:
    when:
      visible:
        id: "paywall.close"
    commands:
      - tapOn:
          id: "paywall.close"
- extendedWaitUntil:
    visible:
      id: "camera.shutter"
    timeout: 20000
