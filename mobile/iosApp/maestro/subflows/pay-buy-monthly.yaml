# Buys the Monthly plan from an open paywall through the RevenueCat Test Store dialog. Preconditions:
# paywall on screen, signed in, offering loaded. Ends on the camera: a confirmed entitlement closes the cover by
# itself (PremiumGate.swift), so the confirmation banner is deliberately NOT asserted here.
#
# Build 21 removed the selected-plan summary line above the CTA (the cards state their own billed amount and
# period), so the selection is proven where it now lives: on the card's own selected state. The card is an
# accessibility container that exposes `selected` / `not selected`, so the check is a conditional assertion —
# when the hierarchy carries the state we assert it, and the purchase below is the outcome either way.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "paywall.cta"
    timeout: 30000
- assertVisible: "Unlock the pose camera"
- assertVisible:
    id: "paywall.plan.annual"
# Yearly is preselected (catalog order); buying monthly requires an EXPLICIT tap on the monthly card.
- scrollUntilVisible:
    element:
      id: "paywall.plan.monthly"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "paywall.plan.annual"
        text: '.*selected.*'
    commands:
      - assertVisible:
          id: "paywall.plan.monthly"
          text: '.*not selected.*'
- tapOn:
    id: "paywall.plan.monthly"
- runFlow:
    when:
      visible:
        id: "paywall.plan.monthly"
        text: '.*selected.*'
    commands:
      - assertVisible:
          id: "paywall.plan.annual"
          text: '.*not selected.*'
- tapOn:
    id: "paywall.cta"
# Test Store dialog (SDK-owned, in-process): "Test valid purchase" / "Test failed purchase" / "Cancel".
# A purchase that never reaches the store leaves this step waiting, which is the failure we want.
- extendedWaitUntil:
    visible: "Test valid purchase"
    timeout: 30000
- tapOn: "Test valid purchase"
- extendedWaitUntil:
    notVisible: "Test valid purchase"
    timeout: 60000
# Belt and braces: if the cover is still up (a slower answer than this step), close it so every caller
# continues from the camera.
- runFlow:
    when:
      visible:
        id: "paywall.close"
    commands:
      - tapOn:
          id: "paywall.close"
- extendedWaitUntil:
    visible:
      id: "camera.shutter"
    timeout: 20000
