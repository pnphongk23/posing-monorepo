# Sign in with the run-time E2E account and land back on the Poses home.
# Credentials come from `maestro -e E2E_EMAIL=... -e E2E_PASSWORD=...`, never from the repo.
# Every tap is preceded by a bounded wait: a maestro `tapOn` for an element that never appears is the
# one thing that can hang a run for many minutes, so a missing surface must fail here within seconds.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "poses.more"
    timeout: 20000
- tapOn:
    id: "poses.more"
- extendedWaitUntil:
    visible:
      id: "poses.menu.settings"
    timeout: 15000
- tapOn:
    id: "poses.menu.settings"
- extendedWaitUntil:
    visible:
      id: "settings.account.row"
    timeout: 15000
- tapOn:
    id: "settings.account.row"
- extendedWaitUntil:
    visible:
      id: "signin.emailEntry"
    timeout: 20000
- tapOn:
    id: "signin.emailEntry"
- extendedWaitUntil:
    visible:
      id: "signin.email"
    timeout: 15000
- tapOn:
    id: "signin.email"
- inputText: ${E2E_EMAIL}
- extendedWaitUntil:
    visible:
      id: "signin.password"
    timeout: 15000
- tapOn:
    id: "signin.password"
- inputText: ${E2E_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "signin.submit"
    timeout: 15000
- tapOn:
    id: "signin.submit"
# Signed-in proof: the sign-in card (email entry) is replaced by the profile + Delete account row.
- extendedWaitUntil:
    notVisible:
      id: "signin.emailEntry"
    timeout: 30000
- extendedWaitUntil:
    visible: "Delete account"
    timeout: 15000
# Account -> Settings -> Poses home.
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings.account.row"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 15000
