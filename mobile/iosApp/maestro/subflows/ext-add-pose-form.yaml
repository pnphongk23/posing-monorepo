# Add pose form, 1.1 (18) copy: "Change photo" / inline Add tag field / "Add pose" CTA.
# Tags: `addPose.tagsField` is the inline Add tag field — a comma-separated value yields two chips,
# and text without a comma commits on blur.
appId: ${APP_ID}
---
- tapOn:
    id: "poses.add-pose"
- extendedWaitUntil:
    visible:
      id: "addPose.photoPicker"
    timeout: 15000
- tapOn:
    id: "addPose.photoPicker"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 20000
- tapOn:
    point: "16%,25%"
- runFlow:
    when:
      notVisible: "Change photo"
    commands:
      - tapOn:
          point: "16%,25%"
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn:
                point: "16%,25%"
- extendedWaitUntil:
    visible: "Change photo"
    timeout: 20000
# Tags first: the keyboard shift happens once, so the name tap stays on stable coordinates.
# One tag: the inline Add tag field commits on blur, so the name tap below commits it.
- tapOn:
    id: "addPose.tagsField"
- inputText: "standing"
- tapOn:
    id: "addPose.nameField"
- assertVisible:
    id: "addPose.tag.standing"
- tapOn:
    id: "addPose.nameField"
- inputText: ${POSE_NAME}
- assertVisible:
    id: "addPose.nameField"
    text: ".*${POSE_NAME}.*"
- scroll
- scroll
