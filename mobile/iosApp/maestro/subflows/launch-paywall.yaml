# Clean launch with the Debug-only paywall switch set from env PAYWALL ("YES"/"NO"), accounts on and purchases
# treated as configured so the gate can answer; Firestore untouched.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
      photos: allow
    arguments:
      AIPosePaywallEnabled: ${PAYWALL}
      AIPoseAccountsEnabled: "YES"
      AIPosePurchasesConfigured: "YES"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
