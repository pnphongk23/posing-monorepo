# Email sign-in for the purchase flows. Credentials arrive as ${E2E_EMAIL} / ${E2E_PASSWORD} from the
# runner (`-e E2E_EMAIL=...` or the shell env); TC-PAY-006 injects the B pair under the same names via
# `env:` on its runFlow. Nothing credential-shaped lives in this file, and an unset pair fails here
# with a readable label instead of typing into empty fields.
appId: ${APP_ID}
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0}
    label: "E2E_EMAIL is unset — run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- assertTrue:
    condition: ${E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_PASSWORD is unset — run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: open-settings.yaml
- tapOn:
    id: "settings.account.row"
# At accessibility text sizes the Account card fills the screen and the email entry sits below the fold:
# scroll to it instead of assuming the layout.
- scrollUntilVisible:
    element:
      id: "signin.emailEntry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "signin.emailEntry"
- extendedWaitUntil:
    visible:
      id: "signin.email"
    timeout: 10000
- tapOn:
    id: "signin.email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "signin.password"
# Let the field take focus before typing: a tap that lands while the keyboard is still animating types
# nothing, and the form then answers with its own "Enter your password" instead of a server error.
- extendedWaitUntil:
    visible:
      id: "signin.password"
    timeout: 5000
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "signin.submit"
# Self-heal the field-focus race once: if the form rejects the empty password rather than the credentials,
# retype and submit again. Anything else (a real auth error) is left to the flow that owns the assertion.
- runFlow:
    when:
      visible:
        id: "signin.password.error"
    commands:
      - tapOn:
          id: "signin.password"
      - eraseText
      - inputText: ${E2E_PASSWORD}
      - tapOn:
          id: "signin.submit"
# "Delete account" only exists in the signed-in Account state, so this proves the session landed
# before any purchase step runs (the server round-trip can be slow on a cold start).
- extendedWaitUntil:
    visible: "Delete account"
    timeout: 60000
- assertNotVisible:
    id: "signin.emailEntry"
# End on Home, so callers can continue with `open-camera` / `open-settings` from a known screen.
- tapOn: "Back"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 20000
