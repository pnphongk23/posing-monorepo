name: iosApp
options:
  bundleIdPrefix: com.aipose
  deploymentTarget:
    iOS: "15.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    resources:
      - iosApp/Assets.xcassets
      - iosApp/LaunchScreen.storyboard
      - iosApp/GoogleService-Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: camerapose.app
      INFOPLIST_FILE: iosApp/Info.plist
