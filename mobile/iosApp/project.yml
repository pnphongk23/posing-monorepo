name: iosApp
options:
  bundleIdPrefix: posing
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.10.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.87.1
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.6.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    exactVersion: 8.12.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - GoogleService-Info.plist.example
    resources:
      - iosApp/Assets.xcassets
      - iosApp/LaunchScreen.storyboard
      - iosApp/GoogleService-Info.plist
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: posing
        PRODUCT_MODULE_NAME: iosApp
        PRODUCT_BUNDLE_IDENTIFIER: posing.camera.app
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
      configs:
        Debug-Prod:
          CODE_SIGN_ENTITLEMENTS: iosApp/iosAppDebug-Prod.entitlements
      INFOPLIST_FILE: iosApp/Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: WZL67P53F2
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseFirestore
      - package: RevenueCat
        product: RevenueCat
      - package: GRDB
        product: GRDB
      - package: Kingfisher
        product: Kingfisher
    configFiles:
      Debug-Dev: Config/Dev-Debug.xcconfig
      Release-Dev: Config/Dev-Release.xcconfig
      Debug-Prod: Config/Prod-Debug.xcconfig
      Release-Prod: Config/Prod-Release.xcconfig
    preBuildScripts:
      - name: RevenueCat key provenance (Release-Prod)
        # The PROD public SDK key lives in the untracked mobile/.env, included by
        # Config/Prod-Release.xcconfig. A clean release worktree without it would archive an
        # unconfigured purchase build, so this fails the build instead. Every other configuration
        # exits immediately; a placeholder there is a supported state (the adapter fail-opens).
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if [ "${CONFIGURATION}" != "Release-Prod" ]; then
            exit 0
          fi

          key="${REVENUECAT_PUBLIC_SDK_KEY:-}"
          env_file="$(cd "$SRCROOT/.." && pwd)/.env"

          # Never print the value: classify its shape only.
          shape=other
          case "$key" in
            '') shape=unset ;;
            appl_*) shape=app_store_key ;;
            test_*) shape=test_store_key ;;
            REPLACE_WITH* | '$(REVENUECAT_PUBLIC_SDK_KEY)') shape=placeholder ;;
          esac

          if [ "$shape" = app_store_key ]; then
            exit 0
          fi

          echo "error: Release-Prod needs the RevenueCat App Store public SDK key (appl_…)." >&2
          echo "error: REVENUECAT_PUBLIC_SDK_KEY resolved to $shape." >&2
          if [ -f "$env_file" ]; then
            echo "error: $env_file exists; check its REVENUECAT_PUBLIC_SDK_KEY line." >&2
          else
            echo "error: $env_file is missing. This worktree is untracked-key-free by design:" >&2
            echo "error: copy mobile/.env from the main checkout (template: mobile/.env.example) before archiving." >&2
          fi
          exit 1
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iosAppTests
    resources:
      - iosAppTests/Fixtures/legacy-aipose-v1.sqlite
      - iosAppTests/Fixtures/legacy-aipose-database-v1.sqlite
      - iosAppTests/Fixtures/legacy-aipose-v1.sql
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: posing.camera.appTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WZL67P53F2
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/posing.app/posing
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: iosApp
      - package: GRDB
        product: GRDB
    configFiles:
      Debug-Dev: Config/Dev-Debug.xcconfig
      Release-Dev: Config/Dev-Release.xcconfig
      Debug-Prod: Config/Prod-Debug.xcconfig
      Release-Prod: Config/Prod-Release.xcconfig
schemes:
  Dev:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - iosAppTests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Prod:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
      targets:
        - iosAppTests
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
