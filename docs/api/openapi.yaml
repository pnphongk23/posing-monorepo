openapi: "3.1.0"
info:
  title: AI Pose — Pose Extract Server API
  version: "0.1.0"
  description: |
    API contract cho pose-extract-server (Express service).
    Chỉ document các business routes của Express server.
    Next.js proxy paths và legacy POST /api/extract được ghi nhận trong conventions.md.

servers:
  - url: https://pose-extract-server-production.up.railway.app
    description: Production (Railway)
  - url: http://localhost:3001
    description: Local development

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: "Bearer <ADMIN_SECRET> — required for all /api/admin/* routes"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: "Pose not found"

    CommunityPose:
      type: object
      required: [id, name, imagePath, tags, bodyParts, status, uploadedAt, downloadCount]
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated UUID
        name:
          type: string
        imagePath:
          type: string
          format: uri
          description: "Full URL — use directly as <img src>"
        thumbnailPath:
          type: [string, "null"]
          format: uri
        tags:
          type: array
          items:
            type: string
        difficulty:
          type: [string, "null"]
          enum: [beginner, intermediate, advanced, null]
        description:
          type: [string, "null"]
        bodyParts:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published]
        uploadedAt:
          type: string
          format: date-time
          description: ISO 8601 datetime string from SQLite
        downloadCount:
          type: integer
          minimum: 0

    ApiKeyPublic:
      type: object
      description: ApiKeyCredential without the secret api_key field
      required: [id, name, status, requestsToday, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, disabled, exhausted]
        requestsToday:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ExtractionJobStatus:
      type: string
      enum: [queued, processing, succeeded, failed]

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Server health check
      tags: [Health]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime, version]
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: Seconds since server start
                  version:
                    type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/extract-pose:
    post:
      operationId: extractPose
      summary: Synchronous pose extraction via Gemini
      tags: [Extract Pose]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG image, max 10 MB
      responses:
        "200":
          description: Extraction succeeded
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [imageBase64, mimeType, processingTimeMs]
                    properties:
                      imageBase64:
                        type: string
                        description: Base64-encoded result image
                      mimeType:
                        type: string
                        enum: [image/png, image/jpeg, image/webp]
                      processingTimeMs:
                        type: integer
                  meta:
                    type: object
                    required: [keyUsed, quotaRemaining]
                    properties:
                      keyUsed:
                        type: string
                        description: Name of the API key that was used
                      quotaRemaining:
                        type: string
                        description: "Approximate quota remaining, e.g. ~80%"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalid_image:
                  value: { error: { code: INVALID_IMAGE, message: "Only JPEG/PNG images are supported" } }
        "413":
          description: Image too large (> 10 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                too_large:
                  value: { error: { code: IMAGE_TOO_LARGE, message: "Image exceeds 10MB limit" } }
        "429":
          description: Rate limited or Gemini quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: All API keys exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                exhausted:
                  value: { error: { code: ALL_KEYS_EXHAUSTED, message: "All API keys are exhausted" } }
        "500":
          description: Provider Gemini error (`GEMINI_ERROR`) or unhandled internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                gemini_error:
                  value: { error: { code: GEMINI_ERROR, message: "Gemini request failed" } }

  /api/community/poses:
    get:
      operationId: listCommunityPoses
      summary: List published community poses
      tags: [Community]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: tag
          in: query
          schema:
            type: string
          description: Exact tag match (case-sensitive JSON LIKE)
      responses:
        "200":
          description: Paginated list of published poses
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPose"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/community/poses/{id}:
    get:
      operationId: getCommunityPose
      summary: Get a published community pose by ID (increments downloadCount)
      tags: [Community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pose found and returned; downloadCount incremented
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CommunityPose"
        "404":
          description: Pose not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                not_found:
                  value: { error: { code: NOT_FOUND, message: "Pose not found" } }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/keys:
    get:
      operationId: listAdminKeys
      summary: List all API keys (secret omitted)
      tags: [Admin Keys]
      security:
        - AdminBearer: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeyPublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminKey
      summary: Create a new API key
      tags: [Admin Keys]
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, apiKey]
              properties:
                name:
                  type: string
                  minLength: 1
                apiKey:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Key created (secret omitted in response)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ApiKeyPublic"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/keys/reset:
    post:
      operationId: resetAdminKeys
      summary: Reset daily counters; re-activate exhausted keys
      tags: [Admin Keys]
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Reset completed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [updated]
                    properties:
                      updated:
                        type: integer
                        description: Number of rows updated
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/keys/{id}:
    patch:
      operationId: updateAdminKey
      summary: Update API key status
      tags: [Admin Keys]
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled, exhausted]
      responses:
        "200":
          description: Key updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ApiKeyPublic"
        "400":
          description: Invalid status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAdminKey
      summary: Delete an API key
      tags: [Admin Keys]
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/community/poses:
    get:
      operationId: listAdminCommunityPoses
      summary: List all community poses (draft + published) sorted by uploadedAt DESC
      tags: [Admin Community]
      security:
        - AdminBearer: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list including draft and published poses
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPose"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminCommunityPose
      summary: Submit pose image; enqueue extraction job; create community record
      tags: [Admin Community]
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, name, bodyParts]
              properties:
                image:
                  type: string
                  format: binary
                  description: PNG, JPEG, or WEBP; max 10 MB
                name:
                  type: string
                  minLength: 1
                bodyParts:
                  type: string
                  description: JSON array string or comma-separated; at least 1 item
                tags:
                  type: string
                  description: JSON array string or comma-separated; optional
                difficulty:
                  type: string
                  enum: [beginner, intermediate, advanced]
                  nullable: true
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, published]
                  default: draft
      responses:
        "202":
          description: Job enqueued; community record created; extraction is async
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pose, jobId, status]
                    properties:
                      pose:
                        $ref: "#/components/schemas/CommunityPose"
                      jobId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: queued
        "400":
          description: Invalid image (INVALID_IMAGE) or invalid metadata (BAD_REQUEST)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: QUEUE_WRITE_FAILED or internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                queue_failed:
                  value: { error: { code: QUEUE_WRITE_FAILED, message: "Failed to enqueue extraction job" } }

  /api/admin/community/poses/upload-url:
    post:
      operationId: createAdminCommunityUploadUrl
      summary: Get presigned R2 upload URL for direct client-side upload
      tags: [Admin Community]
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType]
              properties:
                fileName:
                  type: string
                  minLength: 1
                mimeType:
                  type: string
                  enum: [image/png, image/jpeg, image/webp]
      responses:
        "200":
          description: Presigned upload URL and file key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadUrl, fileKey]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      fileKey:
                        type: string
        "400":
          description: Invalid mimeType or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/admin/jobs/{jobId}:
    get:
      operationId: getAdminJob
      summary: Get extraction job status and result
      tags: [Admin Jobs]
      security:
        - AdminBearer: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobId, status, attempts, maxAttempts, result, error, updatedAt]
                    properties:
                      jobId:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/ExtractionJobStatus"
                      attempts:
                        type: integer
                        minimum: 0
                      maxAttempts:
                        type: integer
                        minimum: 1
                      result:
                        description: Non-null only when status = succeeded
                        oneOf:
                          - type: "null"
                          - type: object
                            required: [imageBase64, mimeType]
                            properties:
                              imageBase64:
                                type: string
                              mimeType:
                                type: string
                                enum: [image/png, image/jpeg, image/webp]
                      error:
                        description: Non-null only when status = failed
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              code:
                                type: [string, "null"]
                              message:
                                type: [string, "null"]
                      updatedAt:
                        type: string
                        format: date-time
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                not_found:
                  value: { error: { code: JOB_NOT_FOUND, message: "Job not found" } }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

tags:
  - name: Health
    description: Service health
  - name: Extract Pose
    description: Synchronous Gemini-based pose extraction
  - name: Community
    description: Public community pose browsing
  - name: Admin Keys
    description: Gemini API key management (admin only)
  - name: Admin Community
    description: Community pose intake and management (admin only)
  - name: Admin Jobs
    description: Extraction job status monitoring (admin only)
