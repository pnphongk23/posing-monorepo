  /api/admin/community/poses:
    get:
      operationId: listAdminCommunityPoses
      summary: List all community poses (local + published) sorted by uploadedAt DESC
      tags: [Admin Community]
      security:
        - AdminBearer: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list including local and published poses (canonical PoseResponse)
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pose"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminCommunityPose
      summary: Create a local Pose after a succeeded extraction job (post-extraction, 201)
      description: >-
        Two-phase contract per the canonical domain model: the image was submitted
        earlier via POST /api/extract-pose (202 + jobId); once that job is 'succeeded'
        this call creates the Pose (stable poseId, status=local) with the three media
        roles (original, skeleton, thumbnail) materialized. Same contract as POST /api/guides.
      tags: [Admin Community]
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, name, bodyParts, ownerAccountId]
              properties:
                jobId:
                  type: string
                  format: uuid
                  description: jobId of a 'succeeded' ExtractionJob (correlation key; no Pose existed before it)
                ownerAccountId:
                  type: string
                  format: uuid
                  description: REQUIRED for admin-created poses — owning Account of the Pose (authenticated actor is the Admin operator, owner differs)
                name:
                  type: string
                  minLength: 1
                bodyParts:
                  type: array
                  items:
                    type: string
                  minItems: 1
                tags:
                  type: array
                  items:
                    type: string
                difficulty:
                  type: [string, "null"]
                  enum: [beginner, intermediate, advanced, null]
                description:
                  type: [string, "null"]
      responses:
        "201":
          description: Pose created (post-extraction) with three media roles materialized; not yet public.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoseCreated"
        "400":
          description: Invalid jobId (JOB_NOT_SUCCEEDED / BAD_REQUEST) or invalid metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

