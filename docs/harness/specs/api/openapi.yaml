  /api/admin/jobs/{jobId}:
    get:
      operationId: getAdminJob
      summary: Get extraction job status and result
      tags: [Admin Jobs]
      security:
        - AdminBearer: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobId, status, attempts, maxAttempts, result, error, updatedAt]
                    properties:
                      jobId:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/ExtractionJobStatus"
                      attempts:
                        type: integer
                        minimum: 0
                      maxAttempts:
                        type: integer
                        minimum: 1
                      result:
                        description: Non-null only when status = succeeded
                        oneOf:
                          - type: "null"
                          - type: object
                            required: [imageBase64, mimeType]
                            properties:
                              imageBase64:
                                type: string
                              mimeType:
                                type: string
                                enum: [image/png, image/jpeg, image/webp]
                      error:
                        description: Non-null only when status = failed
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              code:
                                type: [string, "null"]
                              message:
                                type: [string, "null"]
                      updatedAt:
                        type: string
                        format: date-time
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                not_found:
                  value: { error: { code: JOB_NOT_FOUND, message: "Job not found" } }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

