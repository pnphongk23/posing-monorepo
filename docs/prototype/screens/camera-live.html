<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>posing · Camera</title>
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/components.css?empty-state-1">
  <link rel="stylesheet" href="../styles/components/camera-viewport.css?camera-tools-popup-2">
  <link rel="stylesheet" href="../styles/components/camera-guide.css?pose-picker-2">
</head>
<body class="nb-camera-screen">
  <div class="nb-phone nb-camera-phone">
    <div class="nb-phone__header nb-phone__header--light">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons" aria-hidden="true">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>

    <div class="nb-phone__content nb-phone__content--full">
      <main class="nb-camera-surface" aria-label="Camera">
        <div class="nb-camera-viewport nb-camera-viewport--immersive" id="camera-feed" style="background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=85&w=900');">
          <div class="nb-camera-viewport__top-scrim" aria-hidden="true"></div>
          <div class="nb-camera-viewport__bottom-scrim" aria-hidden="true"></div>

          <div class="nb-camera-viewport__grid-overlay is-hidden" id="camera-grid" aria-hidden="true">
            <div class="nb-camera-viewport__grid-line-h"></div>
            <div class="nb-camera-viewport__grid-line-h"></div>
            <div class="nb-camera-viewport__grid-line-v"></div>
            <div class="nb-camera-viewport__grid-line-v"></div>
          </div>

          <div id="camera-pose-reference" class="nb-camera-pose-reference" aria-hidden="true" hidden></div>

          <div class="nb-camera-viewport__top-controls">
            <button id="camera-close-btn" class="nb-btn nb-btn--compact-action nb-camera-action" aria-label="Close Camera">
              <span class="nb-btn__compact-surface nb-btn__compact-surface--white">
                <svg><use href="#icon-close"></use></svg>
              </span>
            </button>
          </div>

          <div class="nb-camera-zoom-control nb-camera-viewport__zoom-btn" id="camera-zoom-control">
            <div id="camera-zoom-panel" class="nb-camera-zoom-panel" aria-hidden="true" hidden>
              <output id="camera-zoom-value" class="nb-camera-zoom-value" for="camera-zoom-slider" aria-live="polite">1x</output>
              <input id="camera-zoom-slider" class="nb-camera-zoom-slider" type="range" min="0" max="2" step="1" value="1" aria-label="Zoom 1x" aria-valuetext="1x">
            </div>
            <button id="camera-zoom-btn" class="nb-camera-zoom-toggle" type="button" aria-controls="camera-zoom-panel" aria-expanded="false" aria-label="Scale factor">
              <span id="camera-zoom-toggle-value">1x</span>
            </button>
          </div>

          <button id="camera-settings-btn" type="button" class="nb-btn nb-btn--compact-action nb-camera-action nb-camera-viewport__dots-btn nb-camera-viewport__tools-btn" aria-label="Open camera tools" aria-expanded="false" aria-controls="camera-tools-menu">
            <span class="nb-btn__compact-surface nb-btn__compact-surface--white">
              <svg><use href="#icon-settings"></use></svg>
            </span>
          </button>

          <button id="camera-guide-btn" type="button" class="nb-btn nb-btn--compact-action nb-camera-guide-chip nb-camera-viewport__profile-btn" aria-label="Choose a pose" aria-expanded="false" aria-controls="pose-picker-sheet">
            <span class="nb-btn__compact-surface nb-camera-guide-surface">
              <svg><use href="#icon-image"></use></svg>
            </span>
          </button>

          <p id="camera-status" class="nb-camera-status" role="status" aria-live="polite" hidden></p>

          <div id="camera-tools-menu" class="nb-camera-tools-menu" aria-hidden="true" hidden>
            <section class="nb-camera-tools-panel" role="menu" aria-labelledby="camera-tools-title">
              <h2 id="camera-tools-title" class="sr-only">Camera tools</h2>
              <div class="nb-camera-tools-list">
                <button type="button" class="nb-camera-setting-row" id="flash-row" role="menuitem" aria-label="Flash Auto, tap to change">
                  <span class="nb-camera-setting-row__label">
                    <svg><use href="#icon-flash"></use></svg>
                    <span>Flash</span>
                  </span>
                  <span class="nb-camera-setting-row__value" id="flash-value">Auto</span>
                </button>

                <div class="nb-camera-setting-row" role="group" aria-label="Grid">
                  <span class="nb-camera-setting-row__label">
                    <svg><use href="#icon-grid"></use></svg>
                    <span>Grid</span>
                  </span>
                  <label class="nb-switch nb-camera-setting-switch">
                    <span class="sr-only">Show camera grid</span>
                    <input type="checkbox" id="grid-switch">
                    <span class="nb-switch__slider"></span>
                  </label>
                </div>

                <div class="nb-camera-tools-divider" data-pose-tools hidden aria-hidden="true"></div>
                <section class="nb-camera-tools-section" data-pose-tools hidden aria-labelledby="camera-pose-tools-title">
                  <h3 id="camera-pose-tools-title">Pose guide</h3>

                  <button type="button" class="nb-camera-setting-row" id="pose-visibility-row" role="menuitem" aria-pressed="true" aria-label="Hide pose guide">
                    <span class="nb-camera-setting-row__label"><span>Pose guide</span></span>
                    <span class="nb-camera-setting-row__value" id="pose-visibility-value">Shown</span>
                  </button>

                  <label class="nb-camera-tool-slider-row" for="pose-opacity-slider">
                    <span class="nb-camera-tool-slider-row__heading">
                      <span>Opacity</span>
                      <output id="pose-opacity-value" for="pose-opacity-slider">50%</output>
                    </span>
                    <input id="pose-opacity-slider" type="range" min="0.1" max="1" step="0.05" value="0.5" aria-label="Pose guide opacity 50 percent" aria-valuetext="50%">
                  </label>

                  <div class="nb-camera-tool-choice-row" role="group" aria-label="Pose line color">
                    <span>Line color</span>
                    <div class="nb-camera-tool-choices">
                      <button type="button" class="nb-camera-tool-choice is-selected" id="pose-line-color-black" aria-pressed="true">Black</button>
                      <button type="button" class="nb-camera-tool-choice" id="pose-line-color-white" aria-pressed="false">White</button>
                    </div>
                  </div>

                  <button type="button" class="nb-camera-setting-row nb-camera-setting-row--action" id="clear-pose-row" role="menuitem">
                    <span class="nb-camera-setting-row__label"><span>Clear pose</span></span>
                  </button>
                </section>
              </div>
            </section>
          </div>

          <div id="camera-permission-state" class="nb-camera-permission" hidden>
            <div class="nb-camera-permission__icon">
              <svg><use href="#icon-camera"></use></svg>
            </div>
            <h2>Camera access is off</h2>
            <p>Allow camera access in Settings to line up and capture your pose.</p>
            <button type="button" id="camera-permission-action" class="nb-btn nb-btn--white">Open Settings</button>
          </div>
        </div>

        <div class="nb-shutter-bar nb-shutter-bar--redesign" aria-label="Capture controls">
          <button id="camera-gallery-thumb" class="nb-shutter-bar__thumb" type="button" style="background-image: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=150');" aria-label="Open Gallery"></button>

          <div class="nb-shutter-bar__capture">
            <span id="camera-shutter-label" class="sr-only">Capture photo</span>
            <button id="shutter-btn" class="nb-btn nb-btn--shutter" type="button" aria-label="Capture photo">
              <span class="nb-shutter-spinner" aria-hidden="true"></span>
              <span class="sr-only">Capture photo</span>
            </button>
          </div>

          <button id="camera-flip-btn" class="nb-btn nb-btn--square nb-btn--white nb-camera-flip" type="button" aria-label="Switch to front camera">
            <svg><use href="#icon-flip"></use></svg>
          </button>
        </div>

        <div id="pose-picker-sheet" class="nb-pose-picker-sheet" aria-hidden="true" hidden>
          <button class="nb-pose-picker-sheet__backdrop" type="button" data-close-pose-picker aria-label="Close pose picker"></button>
          <section class="nb-pose-picker-panel" role="dialog" aria-modal="true" aria-labelledby="pose-picker-title">
            <div class="nb-pose-picker-panel__handle" aria-hidden="true"></div>
            <header class="nb-pose-picker-panel__header">
              <div>
                <h2 id="pose-picker-title">Choose a pose</h2>
              </div>
              <button type="button" id="pose-picker-close" class="nb-btn nb-btn--compact-action nb-camera-action" data-close-pose-picker aria-label="Close pose picker">
                <span class="nb-btn__compact-surface nb-btn__compact-surface--white">
                  <svg><use href="#icon-close"></use></svg>
                </span>
              </button>
            </header>

            <form id="pose-picker-search-form" class="nb-pose-picker-search" role="search">
              <label for="pose-picker-search-input" class="sr-only">Search poses</label>
              <div class="nb-pose-picker-search__field">
                <svg aria-hidden="true"><use href="#icon-search"></use></svg>
                <input id="pose-picker-search-input" class="nb-search-bar__input" type="search" placeholder="Search poses" autocomplete="off" enterkeyhint="search">
                <button id="pose-picker-search-clear" class="nb-pose-picker-search__clear" type="button" aria-label="Clear search" hidden>
                  <svg aria-hidden="true"><use href="#icon-close"></use></svg>
                </button>
              </div>
            </form>

            <div class="nb-pose-picker-scroll">
                <nb-empty-state id="pose-picker-state" class="nb-pose-picker-state" hidden></nb-empty-state>
              <div id="pose-picker-grid" class="nb-grid--masonry" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js?camera-tools-popup-1"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js?camera-tools-popup-1"></script>
    <script src="../scripts/view-toggle.js"></script>
    <script src="../scripts/button-press.js"></script>
    <script src="../scripts/empty-state.js"></script>
    <script src="../scripts/guide-picker.js?pose-picker-2"></script>
  <script src="../scripts/app.js?camera-tools-popup-1"></script>
</body>
</html>
