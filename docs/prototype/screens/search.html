<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Pose - Snap Pose</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/search.css">
</head>
<body>
  <div class="nb-phone">
    <!-- Status Bar -->
    <div class="nb-phone__header">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;" aria-hidden="true">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>

    <!-- Phone Content Area -->
    <main class="nb-phone__content nb-search-screen" id="pose-search">
      <header class="nb-nav-bar nb-search-nav">
        <div class="nb-nav-bar__left">
          <a href="poses-list.html" class="nb-btn nb-btn--square nb-btn--white" aria-label="Back to pose library">
            <svg aria-hidden="true"><use href="#icon-back"></use></svg>
          </a>
        </div>
        <h1 class="nb-nav-bar__title nb-search-nav__title">Search</h1>
        <div class="nb-nav-bar__right" aria-hidden="true"></div>
      </header>

      <form class="nb-search-form" id="search-form" role="search">
        <label for="search-screen-input" class="sr-only">Search poses</label>
        <div class="nb-search-field">
          <svg aria-hidden="true"><use href="#icon-search"></use></svg>
          <input type="search" id="search-screen-input" class="nb-search-bar__input" placeholder="Search poses" autocomplete="off" enterkeyhint="search" autofocus>
          <button id="search-clear-btn" class="nb-search-clear" type="button" aria-label="Clear search" hidden>
            <svg aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
      </form>

      <div id="search-state-message" class="nb-state-message nb-search-state" role="status" aria-live="polite" hidden></div>

      <div id="search-discovery" class="nb-search-discovery" aria-live="polite">
        <section class="nb-search-section" aria-labelledby="recent-heading">
          <div class="nb-search-section__header">
            <h2 id="recent-heading">Recent searches</h2>
          </div>
          <div class="nb-search-chip-row" id="search-recent-chips" aria-label="Recent searches">
            <button type="button" class="nb-search-chip" data-search-query="Dancing">Dancing</button>
            <button type="button" class="nb-search-chip" data-search-query="Stretching">Stretching</button>
            <button type="button" class="nb-search-chip" data-search-query="Warrior">Warrior</button>
          </div>
        </section>
      </div>

      <section id="search-results-panel" class="nb-search-results-panel" aria-labelledby="search-results-heading" hidden>
        <div class="nb-search-results-header">
          <div>
            <p class="nb-search-kicker">YOUR MATCHES</p>
            <h2 id="search-results-heading">Results</h2>
          </div>
          <span id="search-results-count" class="nb-search-results-count" aria-live="polite">0 poses</span>
        </div>

        <div class="nb-search-filter-row" role="group" aria-label="Filter search results">
          <button type="button" class="nb-search-filter is-active" data-search-source="all" aria-pressed="true">All poses</button>
          <button type="button" class="nb-search-filter" data-search-source="my-poses" aria-pressed="false">My poses</button>
          <button type="button" class="nb-search-filter" data-search-source="community" aria-pressed="false">Community</button>
        </div>

        <div class="nb-grid-scroll-area nb-search-results-scroll">
          <div class="nb-grid--masonry" id="search-results-grid" aria-live="polite">
            <!-- Populated dynamically by scripts/app.js -->
          </div>
        </div>
      </section>
    </main>

    <!-- Home Bar Indicator -->
    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js"></script>
  <script src="../scripts/view-toggle.js"></script>
  <script src="../scripts/button-press.js"></script>
  <script src="../scripts/tab-bar.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    initTabBar(null);
  </script>
</body>
</html>
