          <svg><use href="#icon-back"></use></svg>

      <section aria-labelledby="available-guides-title">

        <div class="nb-camera-guide-grid">
          <a href="camera-live.html?guide=standing" class="nb-camera-guide-card" data-select-guide aria-label="Use Standing guide">

  <script src="../scripts/icons.js"></script>

</html>
