<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Pose</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="nb-phone">
    <!-- Status Bar -->
    <div class="nb-phone__header">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>
    
    <!-- Phone Content Area -->
    <div class="nb-phone__content">
      <!-- Navigation Bar -->
      <nav class="nb-nav-bar" aria-label="Main Navigation">
        <div class="nb-nav-bar__left">
          <a href="camera-live.html" class="nb-btn nb-btn--square nb-btn--white" aria-label="Go Back">
            <svg style="width: 20px; height: 20px;"><use href="#icon-back"></use></svg>
          </a>
        </div>
        <h1 class="nb-nav-bar__title">Extract</h1>
        <div class="nb-nav-bar__right">
          <button class="nb-btn nb-btn--square nb-btn--green" style="border-radius: var(--nb-radius-circle);" aria-label="Info">
            <svg style="width: 20px; height: 20px;"><use href="#icon-info"></use></svg>
          </button>
        </div>
      </nav>

      <!-- Main Image Card with Skeleton Overlay -->
      <div class="nb-card u-w-full u-flex-grow" style="position: relative; margin-bottom: var(--nb-space-md); border-radius: var(--nb-radius-large); min-height: 380px;">
        <!-- Base image (blonde girl) -->
        <div style="width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=600'); background-size: cover; background-position: center; position: absolute; top: 0; left: 0;"></div>
        
        <!-- Detecting... Badge -->
        <div class="nb-card__tag nb-tag nb-tag--badge nb-tag--yellow nb-card__tag--top-right" style="top: var(--nb-space-md); left: var(--nb-space-md); right: auto;">
          <svg fill="currentColor"><use href="#icon-chip"></use></svg>
          <span>Detecting...</span>
        </div>

        <!-- Joint Overlay SVG -->
        <svg viewBox="0 0 100 100" class="nb-pose-overlay" preserveAspectRatio="none">
          <!-- Bones -->
          <!-- Shoulder connection -->
          <line x1="38" y1="28" x2="62" y2="28" class="nb-pose-bone nb-pose-bone--skeleton" />
          <!-- Head to chest -->
          <line x1="50" y1="14" x2="50" y2="28" class="nb-pose-bone nb-pose-bone--skeleton" />
          <!-- Left Arm -->
          <line x1="38" y1="28" x2="28" y2="43" class="nb-pose-bone nb-pose-bone--skeleton" />
          <line x1="28" y1="43" x2="24" y2="57" class="nb-pose-bone nb-pose-bone--skeleton" />
          <!-- Right Arm -->
          <line x1="62" y1="28" x2="72" y2="41" class="nb-pose-bone nb-pose-bone--skeleton" />
          <line x1="72" y1="41" x2="78" y2="55" class="nb-pose-bone nb-pose-bone--skeleton" />
          <!-- Spine -->
          <line x1="50" y1="28" x2="50" y2="52" class="nb-pose-bone nb-pose-bone--skeleton" />
          <!-- Hip connection -->
          <line x1="40" y1="55" x2="60" y2="55" class="nb-pose-bone nb-pose-bone--skeleton-lower" />
          <!-- Left Leg -->
          <line x1="40" y1="55" x2="38" y2="72" class="nb-pose-bone nb-pose-bone--skeleton-lower" />
          <line x1="38" y1="72" x2="36" y2="88" class="nb-pose-bone nb-pose-bone--skeleton-lower" />
          <!-- Right Leg -->
          <line x1="60" y1="55" x2="62" y2="70" class="nb-pose-bone nb-pose-bone--skeleton-lower" />
          <line x1="62" y1="70" x2="64" y2="86" class="nb-pose-bone nb-pose-bone--skeleton-lower" />

          <!-- Joint Dots -->
          <!-- Head / Nose -->
          <circle cx="50" cy="14" class="nb-pose-joint nb-pose-joint--head" />
          <!-- Eyes -->
          <circle cx="47" cy="12" class="nb-pose-joint nb-pose-joint--eyes" />
          <circle cx="53" cy="12" class="nb-pose-joint nb-pose-joint--eyes" />
          <!-- Chest -->
          <circle cx="50" cy="28" class="nb-pose-joint nb-pose-joint--shoulders" />
          <!-- Shoulders -->
          <circle cx="38" cy="28" class="nb-pose-joint nb-pose-joint--shoulders" />
          <circle cx="62" cy="28" class="nb-pose-joint nb-pose-joint--shoulders" />
          <!-- Elbows -->
          <circle cx="28" cy="43" class="nb-pose-joint nb-pose-joint--elbows" />
          <circle cx="72" cy="41" class="nb-pose-joint nb-pose-joint--elbows" />
          <!-- Wrists -->
          <circle cx="24" cy="57" class="nb-pose-joint nb-pose-joint--wrists" />
          <circle cx="78" cy="55" class="nb-pose-joint nb-pose-joint--wrists" />
          <!-- Hips -->
          <circle cx="40" cy="55" class="nb-pose-joint nb-pose-joint--hips" />
          <circle cx="60" cy="55" class="nb-pose-joint nb-pose-joint--hips" />
          <!-- Knees -->
          <circle cx="38" cy="72" class="nb-pose-joint nb-pose-joint--knees" />
          <circle cx="62" cy="70" class="nb-pose-joint nb-pose-joint--knees" />
          <!-- Ankles -->
          <circle cx="36" cy="88" class="nb-pose-joint nb-pose-joint--wrists" />
          <circle cx="64" cy="86" class="nb-pose-joint nb-pose-joint--wrists" />
        </svg>

        <!-- 17/17 Joints Badge -->
        <div class="nb-card__tag nb-tag nb-tag--badge nb-card__tag u-bg-white" style="bottom: var(--nb-space-md); right: var(--nb-space-md); left: auto;">
          <span>17/17 Joints</span>
        </div>
      </div>

      <!-- Progress Section -->
      <div class="nb-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Extraction Progress">
        <div class="nb-progress__label-container">
          <span>Extracting Pose</span>
          <span id="progress-percentage">0%</span>
        </div>
        <div class="nb-progress__track">
          <div class="nb-progress__fill">
            <div class="nb-progress__handle"></div>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <a href="poses-list.html" class="nb-btn nb-btn--block nb-btn--pink u-text-center u-mb-md">
        <svg><use href="#icon-bookmark"></use></svg>
        Save Pose
      </a>
    </div>
    
    <!-- Home Bar Indicator -->
    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js"></script>
  <script src="../scripts/view-toggle.js"></script>
  <script src="../scripts/button-press.js"></script>
  <script src="../scripts/app.js"></script>
</body>
</html>
