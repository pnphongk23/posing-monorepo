<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>posing</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/components.css?empty-state-1">
</head>
<body>
  <div class="nb-phone">
    <!-- Status Bar -->
    <div class="nb-phone__header">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>
    
    <!-- Phone Content Area -->
    <main class="nb-phone__content" id="pose-detail-screen">
      <!-- Navigation Bar -->
      <nav class="nb-nav-bar" aria-label="Main Navigation">
        <div class="nb-nav-bar__left">
            <a id="detail-back" href="poses-list.html" class="nb-btn nb-btn--square nb-btn--white" aria-label="Go Back">
            <svg style="width: 20px; height: 20px;"><use href="#icon-back"></use></svg>
          </a>
        </div>
        <h1 class="nb-nav-bar__title" id="detail-page-title">Dancing</h1>
        <div class="nb-nav-bar__right" aria-hidden="true"></div>
      </nav>

        <nb-empty-state id="detail-unavailable-state" hidden></nb-empty-state>

      <div id="detail-content">
        <!-- Large Pose Detail Card -->
        <div class="nb-card nb-card--pose-detail u-w-full" style="margin-bottom: var(--nb-space-md);">
          <!-- Stick figure display -->
          <div id="detail-pose-svg-container" class="u-d-flex u-align-center u-w-full u-h-full" style="justify-content: center;">
            <!-- SVG injected here -->
          </div>
        </div>

        <!-- Pose Details Label -->
        <div class="u-mb-lg">
          <span class="nb-detail-source nb-tag nb-tag--blue" id="detail-pose-source">Community</span>
          <h2 class="u-type-heading-3" id="detail-pose-name" style="margin: var(--nb-space-sm) 0 var(--nb-space-2xs);">Dancing</h2>
          <span class="u-type-caption u-text-muted" id="detail-pose-context">Published</span>
        </div>

        <!-- Only available source metadata is rendered. -->
        <div id="detail-metadata" class="nb-detail-metadata u-d-flex u-gap-sm u-mb-md" role="list" aria-label="Pose metadata">
          <!-- Populated by scripts/app.js -->
        </div>

        <div class="nb-detail-actions u-d-flex u-gap-sm">
          <button type="button" class="nb-btn nb-btn--pink nb-btn--block u-flex-grow u-justify-between" id="detail-try-pose-btn">
            <svg aria-hidden="true"><use href="#icon-camera"></use></svg>
            <span>Try pose</span>
            <span style="opacity: 0;" aria-hidden="true"></span>
          </button>
          <button type="button" id="detail-delete-btn" class="nb-btn nb-btn--cream" data-open-modal="delete-pose-modal" hidden>
            Delete
          </button>
        </div>
      </div>
    </main>

    <!-- Personal-only destructive confirmation -->
    <div id="delete-pose-modal" class="nb-modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <div class="nb-modal">
        <h2 id="delete-modal-title" class="u-type-heading-3">Delete this pose?</h2>
        <p id="delete-modal-copy" class="u-type-body u-text-muted u-mb-md">This removes the pose from My Poses.</p>
        <div class="u-d-flex u-gap-sm u-justify-end">
          <button type="button" class="nb-btn nb-btn--white" data-close-modal>Cancel</button>
          <button type="button" id="confirm-delete-btn" class="nb-btn nb-btn--pink">Delete pose</button>
        </div>
      </div>
    </div>
    
    <!-- Home Bar Indicator -->
    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js"></script>
    <script src="../scripts/view-toggle.js"></script>
    <script src="../scripts/button-press.js"></script>
    <script src="../scripts/empty-state.js"></script>
    <script src="../scripts/app.js"></script>
</body>
</html>
