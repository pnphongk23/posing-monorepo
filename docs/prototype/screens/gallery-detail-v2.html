<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Pose — Gallery detail v2</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #ded8cf;
      --surface: #faf8f3;
      --surface-raised: #ffffff;
      --surface-muted: #eee9e1;
      --ink: #171717;
      --ink-muted: #69645d;
      --line: #171717;
      --accent: #e7a1b0;
      --accent-strong: #cf6f86;
      --success: #dff5d0;
      --danger: #f4c4bf;
      --shadow: #171717;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 3px; }

    .phone {
      position: relative;
      display: flex;
      width: min(390px, 100%);
      height: min(844px, calc(100svh - 32px));
      min-height: 560px;
      overflow: hidden;
      flex-direction: column;
      border: 3px solid var(--line);
      border-radius: 36px;
      background: var(--surface);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    .topbar {
      display: grid;
      align-items: center;
      grid-template-columns: 78px minmax(0, 1fr) 90px;
      gap: 0;
      padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
    }
    .topbar > .icon-button { justify-self: start; }
    .topbar__title { width: 100%; min-width: 0; text-align: center; }
    .topbar__title strong { display: block; white-space: nowrap; font-size: 18px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
    .topbar__title span { display: block; margin-top: 4px; color: var(--ink-muted); font-size: 13px; line-height: 1.15; }
    .topbar__actions { display: flex; align-items: center; justify-self: end; gap: 2px; }

    .icon-button,
    .plain-button {
      display: inline-grid;
      min-width: 44px;
      min-height: 44px;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--shadow);
      cursor: pointer;
      transition: transform 120ms ease-out, box-shadow 120ms ease-out, background 160ms ease-out;
    }
    .topbar .icon-button { border: 0; border-radius: 999px; background: transparent; box-shadow: none; }
    .topbar .icon-button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .icon-button:active,
    .plain-button:active,
    .action:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shadow); }
    .icon-button svg { width: 18px; height: 18px; }
    .topbar .icon-button svg { width: 24px; height: 24px; }
    .icon-button[aria-pressed="true"] { background: var(--accent); }

    .content {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .photo-frame {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: var(--surface-muted);
    }
    .photo-frame::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }
    .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 27%;
    }
    .photo-frame.is-loading .photo { visibility: hidden; }
    .photo-frame.is-missing .photo { display: none; }
    .photo-frame.is-deleted .photo { display: none; }
    .skeleton { display: none; position: absolute; inset: 0; padding: 18px; }
    .photo-frame.is-loading .skeleton { display: block; }
    .skeleton__block { height: 100%; border-radius: 12px; background: var(--surface-muted); animation: pulse 900ms ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }

    .empty-photo {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      align-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }
    .photo-frame.is-missing .empty-photo,
    .photo-frame.is-deleted .empty-photo { display: grid; }
    .empty-photo svg { width: 34px; height: 34px; }
    .empty-photo strong { font-size: 16px; }
    .empty-photo span { max-width: 220px; color: var(--ink-muted); font-size: 13px; line-height: 1.4; }

    .action-tray {
      padding: 18px 12px calc(16px + env(safe-area-inset-bottom));
      background: var(--surface);
    }
    .action-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    .action {
      display: flex;
      min-height: 70px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-direction: column;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      box-shadow: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: transform 120ms ease-out, background 160ms ease-out;
    }
    .action:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .action:active:not(:disabled) { transform: scale(.96); box-shadow: none; }
    .action svg { width: 24px; height: 24px; }
    .action--primary { color: var(--ink); }
    .action--primary.is-success { color: #3c7431; }
    .action:disabled { cursor: not-allowed; opacity: .38; }
    .action-row { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
    .action--quiet { min-height: 44px; width: min(100%, 220px); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: none; font-size: 12px; }
    .action--danger { color: #8e302b; }
    .action-row:has(#retry-button[hidden]) { display: none; }

    .toast {
      position: absolute;
      right: 18px;
      bottom: calc(132px + env(safe-area-inset-bottom));
      left: 18px;
      z-index: 5;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface-raised);
      box-shadow: 3px 3px 0 var(--shadow);
      font-size: 13px;
      font-weight: 750;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }
    .toast.is-error { background: var(--danger); }

    .scrim { display: none; position: absolute; inset: 0; z-index: 8; background: rgba(23, 23, 23, .42); }
    .scrim.is-visible { display: block; }
    .delete-sheet {
      position: absolute;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 12px;
      padding: 18px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 5px 5px 0 var(--shadow);
      transform: translateY(120%);
      transition: transform 220ms var(--ease-out);
    }
    .scrim.is-visible .delete-sheet { transform: translateY(0); }
    .delete-sheet h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .delete-sheet p { margin: 7px 0 15px; color: var(--ink-muted); font-size: 13px; line-height: 1.4; }
    .delete-sheet__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .delete-sheet__actions button { min-height: 46px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface-raised); box-shadow: 2px 2px 0 var(--shadow); color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 800; }
    .delete-sheet__actions .confirm { background: var(--danger); color: #8e302b; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #292725; --surface: #1f1e1c; --surface-raised: #2b2927; --surface-muted: #353230; --ink: #f7f3ed; --ink-muted: #bab2a8; --line: #f7f3ed; --shadow: #080808; --danger: #5b3431; }
      .action--danger, .delete-sheet__actions .confirm { color: #ffd4cc; }
    }
    @media (max-height: 680px) {
      .content { padding-top: 12px; }
      .photo-frame { aspect-ratio: 1 / .92; }
    }
    @media (max-width: 350px) {
      .topbar__title strong { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Gallery photo detail redesign v2">
    <header class="topbar">
      <button class="icon-button" id="back-button" type="button" aria-label="Back to gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="topbar__title" aria-label="Captured date and time"><strong id="photo-date-main">Feb 25, 2026</strong><span id="photo-time-main">4:51 AM</span></div>
      <div class="topbar__actions">
        <button class="icon-button" id="more-button" type="button" aria-label="Photo options">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
      </div>
    </header>

    <section class="content" aria-live="polite">
      <div class="photo-frame" id="photo-frame">
          <img class="photo" id="photo" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&amp;fit=crop&amp;q=80&amp;w=800" alt="Captured portrait in a relaxed hand-on-hip pose" width="800" height="1423">
        <div class="skeleton" aria-hidden="true"><div class="skeleton__block"></div></div>
        <div class="empty-photo" id="empty-photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L8 19"/></svg>
          <strong id="empty-title">Photo unavailable</strong>
          <span id="empty-copy">This local file is missing, but the gallery record is still safe to recover.</span>
        </div>
      </div>
    </section>

    <footer class="action-tray">
      <div class="action-grid">
        <button class="action" id="share-button" type="button" aria-label="Share photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          <span>Share</span>
        </button>
        <button class="action action--primary" id="save-button" type="button" aria-label="Save to Photos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M5 20h14"/></svg>
          <span id="save-label">Save</span>
        </button>
        <button class="action action--danger" id="delete-button" type="button" aria-label="Delete photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg>
          <span>Trash</span>
        </button>
      </div>
      <div class="action-row">
        <button class="action action--quiet" id="retry-button" type="button" hidden>Try again</button>
      </div>
    </footer>

    <div class="toast" id="toast" role="status"></div>
    <div class="scrim" id="scrim" aria-hidden="true">
      <section class="delete-sheet" role="dialog" aria-modal="true" aria-labelledby="delete-title">
        <h2 id="delete-title">Delete this photo?</h2>
        <p>The photo will be removed from this device. This cannot be undone.</p>
        <div class="delete-sheet__actions">
          <button id="cancel-delete" type="button">Keep photo</button>
          <button class="confirm" id="confirm-delete" type="button">Delete</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const state = params.get('state') || 'ready';
      const photoFrame = document.querySelector('#photo-frame');
      const photo = document.querySelector('#photo');
      const emptyTitle = document.querySelector('#empty-title');
      const emptyCopy = document.querySelector('#empty-copy');
      const dateMain = document.querySelector('#photo-date-main');
      const timeMain = document.querySelector('#photo-time-main');
      const saveButton = document.querySelector('#save-button');
      const saveLabel = document.querySelector('#save-label');
      const shareButton = document.querySelector('#share-button');
      const retryButton = document.querySelector('#retry-button');
      const deleteButton = document.querySelector('#delete-button');
      const toast = document.querySelector('#toast');
      const scrim = document.querySelector('#scrim');
      let toastTimer;
      let saveAttempted = false;

      function showToast(message, isError = false) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.toggle('is-error', isError);
        toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2600);
      }

      function setActionAvailability(enabled) {
        [saveButton, shareButton, deleteButton].forEach((button) => { button.disabled = !enabled; });
      }

      function applyState() {
        if (state === 'loading') {
          photoFrame.classList.add('is-loading');
          setActionAvailability(false);
          window.setTimeout(() => {
            photoFrame.classList.remove('is-loading');
            setActionAvailability(true);
            showToast('Photo ready');
          }, 700);
        }
        if (state === 'missing') {
          photoFrame.classList.add('is-missing');
          emptyTitle.textContent = 'Photo unavailable';
          emptyCopy.textContent = 'This local file is missing, but the gallery record is still safe to recover.';
          retryButton.hidden = false;
          setActionAvailability(false);
        }
        if (state === 'deleted') {
          photoFrame.classList.add('is-deleted');
          emptyTitle.textContent = 'Photo deleted';
          emptyCopy.textContent = 'The local record has been removed. Return to Gallery to continue.';
          setActionAvailability(false);
        }
      }

        const galleryContext = new URLSearchParams(location.search);
        function galleryReturnUrl(deleted = false) {
          const returnParams = new URLSearchParams();
          if (galleryContext.get('filter')) returnParams.set('filter', galleryContext.get('filter'));
          if (galleryContext.get('date')) returnParams.set('date', galleryContext.get('date'));
          if (deleted) returnParams.set('deleted', '1');
          const query = returnParams.toString();
          return `gallery.html${query ? `?${query}` : ''}`;
        }

        document.querySelector('#back-button').addEventListener('click', () => { location.href = galleryReturnUrl(); });
      document.querySelector('#more-button').addEventListener('click', () => showToast('Photo options are available below'));
      saveButton.addEventListener('click', () => {
        if (state === 'save-error' && !saveAttempted) {
          saveAttempted = true;
          retryButton.hidden = false;
          showToast('Couldn’t save to Photos. Try again.', true);
          saveLabel.textContent = 'Try again';
          saveButton.setAttribute('aria-label', 'Try saving to Photos again');
          return;
        }
        saveButton.classList.add('is-success');
        saveLabel.textContent = 'Saved';
        saveButton.setAttribute('aria-label', 'Saved to Photos');
        showToast('Saved to Photos');
      });
      shareButton.addEventListener('click', () => showToast('Share sheet ready'));
      retryButton.addEventListener('click', () => {
        retryButton.hidden = true;
        if (state === 'missing') {
          photoFrame.classList.remove('is-missing');
          setActionAvailability(true);
          showToast('Recovery started');
        } else if (state === 'save-error') {
          saveLabel.textContent = 'Save';
          saveButton.setAttribute('aria-label', 'Save to Photos');
          saveButton.classList.remove('is-success');
          showToast('Ready to try again');
        }
      });
      deleteButton.addEventListener('click', () => {
        scrim.classList.add('is-visible');
        scrim.setAttribute('aria-hidden', 'false');
        document.querySelector('#cancel-delete').focus();
      });
      document.querySelector('#cancel-delete').addEventListener('click', () => {
        scrim.classList.remove('is-visible');
        scrim.setAttribute('aria-hidden', 'true');
        deleteButton.focus();
      });
      document.querySelector('#confirm-delete').addEventListener('click', () => {
        scrim.classList.remove('is-visible');
        scrim.setAttribute('aria-hidden', 'true');
          location.href = galleryReturnUrl(true);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && scrim.classList.contains('is-visible')) document.querySelector('#cancel-delete').click();
      });
      photo.addEventListener('error', () => {
        photoFrame.classList.add('is-missing');
        setActionAvailability(false);
        retryButton.hidden = false;
        showToast('Photo file unavailable', true);
      });
      dateMain.textContent = 'Feb 25, 2026';
      timeMain.textContent = '4:51 AM';
      applyState();
    })();
  </script>
</body>
</html>
