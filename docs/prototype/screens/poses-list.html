<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pose</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="nb-phone">
    <!-- Status Bar -->
    <div class="nb-phone__header">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>
    
    <!-- Phone Content Area -->
    <main class="nb-phone__content" id="poses-library">
      <!-- Custom Poses Header -->
      <header class="nb-nav-bar nb-nav-bar--poses u-mb-sm">
        <h1 class="sr-only">Poses</h1>
        <div class="nb-nav-bar__center">
          <!-- Category tabs live in the toolbar to keep the browsing context visible. -->
          <div class="nb-tabs nb-tabs--toolbar" role="tablist" aria-label="Pose category">
            <button class="nb-tab-btn is-active" role="tab" aria-selected="true" data-category="my-poses">My Poses</button>
            <button class="nb-tab-btn" role="tab" aria-selected="false" data-category="community">Community</button>
          </div>
        </div>
        <div class="nb-nav-bar__right nb-nav-bar__right--actions">
          <a href="paywall.html?return=poses-list.html" class="nb-btn nb-btn--compact-action" aria-label="Upgrade to Premium" id="premium-upgrade-btn">
            <span class="nb-btn__compact-surface" style="background-color: var(--nb-color-accent-yellow);">
              <svg><use href="#icon-crown"></use></svg>
            </span>
          </a>
          <a href="search.html" class="nb-btn nb-btn--compact-action nb-btn--toolbar-search" aria-label="Search poses">
            <span class="nb-btn__compact-surface nb-btn__compact-surface--white">
              <svg><use href="#icon-search"></use></svg>
            </span>
          </a>
          <a href="camera-live.html" class="nb-btn nb-btn--compact-action" aria-label="Create Pose">
            <span class="nb-btn__compact-surface">
              <svg><use href="#icon-plus"></use></svg>
            </span>
          </a>
        </div>
      </header>

      <div id="poses-state-message" class="nb-state-message" role="status" aria-live="polite" hidden></div>

      <!-- Category Label Header -->
      <div class="nb-grid-group-title nb-grid-group-title--count-only" style="margin-top: 0;">
        <span id="poses-count-label" class="nb-grid-group-count">3 poses</span>
      </div>

      <!-- Poses Dynamic Grid -->
      <div class="nb-grid-scroll-area">
        <div class="nb-grid--masonry" id="poses-dynamic-grid">
          <!-- Populated by scripts/app.js -->
        </div>
      </div>
    </main>
    
    <!-- Home Bar Indicator -->
    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js"></script>
  <script src="../scripts/view-toggle.js"></script>
  <script src="../scripts/button-press.js"></script>
  <script src="../scripts/tab-bar.js"></script>
  <script src="../scripts/app.js"></script>
  <script>initTabBar('poses');</script>
</body>
</html>
