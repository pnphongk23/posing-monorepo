<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pose</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="nb-phone">
    <!-- Status Bar -->
    <div class="nb-phone__header">
      <span class="nb-phone__time">9:41</span>
      <div class="nb-phone__status-icons">
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4.95-4.95a7 7 0 0 1 9.9 0l-1.42 1.42a5 5 0 0 0-7.06 0L7.05 16.05zm-2.83-2.83a11 11 0 0 1 15.56 0l-1.42 1.42a9 9 0 0 0-12.72 0L4.22 13.22z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 22h20V2zM20 20h-2V9h2v11zm-4 0h-2V12h2v8zm-4 0h-2V15h2v5z"/>
        </svg>
        <svg class="nb-phone__icon" fill="currentColor" viewBox="0 0 24 24" style="width: 20px;">
          <path d="M17 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm1 9h-2V10h2v4z"/>
        </svg>
      </div>
    </div>
    
    <!-- Phone Content Area -->
    <div class="nb-phone__content">
      <!-- Custom Poses Header -->
      <header class="nb-nav-bar u-mb-sm">
        <h1 class="nb-nav-bar__title nb-nav-bar__title--page">Poses</h1>
        <div class="nb-nav-bar__right nb-nav-bar__right--actions">
          <button id="toggle-search-btn" class="nb-btn nb-btn--square nb-btn--white" aria-label="Toggle Search" aria-expanded="false">
            <svg><use href="#icon-search"></use></svg>
          </button>
          <a href="camera-live.html" class="nb-btn nb-btn--square nb-btn--yellow" aria-label="Create Pose">
            <svg><use href="#icon-plus"></use></svg>
          </a>
        </div>
      </header>

      <!-- Expandable Search Input -->
      <div id="search-bar-container" class="nb-search-bar">
        <svg width="16" height="16" style="color: var(--nb-color-gray); flex-shrink: 0;"><use href="#icon-search"></use></svg>
        <input type="text" id="poses-search-input" class="nb-search-bar__input" placeholder="SEARCH POSES..." aria-label="Search Poses">
      </div>

      <!-- Tabs Component -->
      <div class="nb-tabs" role="tablist">
        <button class="nb-tab-btn is-active" role="tab" aria-selected="true" data-category="my-poses">My Poses</button>
        <button class="nb-tab-btn" role="tab" aria-selected="false" data-category="community">Community</button>
      </div>

      <!-- Category Label Header -->
      <div class="nb-grid-group-title" style="margin-top: 0;">
        <span>Recent</span>
        <span class="nb-grid-group-count">6 Poses</span>
      </div>

      <!-- Poses Dynamic Grid -->
      <div class="nb-grid-scroll-area">
        <div class="nb-grid nb-grid--2col" id="poses-dynamic-grid">
          <!-- Populated by scripts/app.js -->
        </div>
      </div>
    </div>
    
    <!-- Home Bar Indicator -->
    <div class="nb-phone__footer">
      <div class="nb-phone__home-indicator"></div>
    </div>
  </div>

  <!-- Script to toggle the search bar container -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('toggle-search-btn');
      const searchContainer = document.getElementById('search-bar-container');
      const searchInput = document.getElementById('poses-search-input');

      if (toggleBtn && searchContainer) {
        toggleBtn.addEventListener('click', function() {
          const isOpen = searchContainer.classList.toggle('is-open');
          toggleBtn.classList.toggle('is-active', isOpen);
          toggleBtn.setAttribute('aria-expanded', String(isOpen));
          if (isOpen) {
            searchInput.focus();
          } else {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
          }
        });
      }
    });
  </script>

  <!-- Shared Scripts -->
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/fixtures.js"></script>
  <script src="../scripts/toggle.js"></script>
  <script src="../scripts/tabs.js"></script>
  <script src="../scripts/progress.js"></script>
  <script src="../scripts/modal.js"></script>
  <script src="../scripts/view-toggle.js"></script>
  <script src="../scripts/button-press.js"></script>
  <script src="../scripts/tab-bar.js"></script>
  <script src="../scripts/app.js"></script>
  <script>initTabBar('poses');</script>
</body>
</html>
