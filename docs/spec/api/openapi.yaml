                  type: array
                  items:
                    type: string
                difficulty:
                  type: [string, "null"]
                  enum: [beginner, intermediate, advanced, null]
                bodyParts:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated guide
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PoseGuide"
        "401":
          description: Unauthorized
          content:
            application/json:
