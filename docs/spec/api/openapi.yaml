  - name: Guides
    description: PoseGuide lifecycle (FEAT-005)
  - name: Publish
    description: Public visibility (FEAT-006)
  - name: Saved
    description: Signed-in saved collection (FEAT-008)
  - name: Admin Keys
    description: Provider key operations (FEAT-007)
  - name: Admin Community
    description: Admin intake onto the same PoseGuide model (FEAT-007)
  - name: Admin Jobs
    description: Job status polling (FEAT-005, FEAT-007)

