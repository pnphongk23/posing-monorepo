# TC-JOB-009 Hide drops the row and keeps the pose
appId: ${APP_ID}
tags: [TC-JOB-009, p1, e2e]
---
- runFlow: ../../../../mobile/iosApp/maestro/subflows/ext-launch.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/ext-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.finish"
    timeout: 20000
- tapOn:
    id: "jobs.tab.finish"
- assertVisible: '.*Done . added to Poses.*'
# Hide, not Remove: the pose survives, only the row goes.
- swipe:
    start: "90%,30%"
    end: "10%,30%"
- tapOn:
    id: "jobs.row.hide..*"
- runFlow:
    when:
      visible:
        id: "jobs.hide.confirm"
    commands:
      - tapOn:
          id: "jobs.hide.confirm"
- assertNotVisible: '.*Done . added to Poses.*'
- assertVisible:
    id: "jobs.footer.hint"
