# TC-JOB-009 Hide drops the row without a dialog and keeps the pose
appId: ${APP_ID}
tags: [TC-JOB-009, p1, e2e]
---
- runFlow: ../subflows/ext-launch.yaml
- runFlow: ../subflows/ext-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.finish"
    timeout: 20000
- tapOn:
    id: "jobs.tab.finish"
- assertVisible: '.*Done . added to Poses.*'
# The gesture explains itself once.
- assertVisible: ".*Swipe a finished job left to hide it.*"
# Hide, not Remove: no confirmation dialog appears, the row just goes.
- swipe:
    start: "90%,30%"
    end: "10%,30%"
- tapOn:
    id: "jobs.row.remove..*"
- assertNotVisible: "Remove job?"
- assertNotVisible: '.*Done . added to Poses.*'
