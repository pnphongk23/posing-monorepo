# TC-EXT-009 processing screen: no percentages, status continues in Jobs
appId: ${APP_ID}
tags: [TC-EXT-009, p1, e2e]
---
- runFlow: ../subflows/rd-launch.yaml
- runFlow: ../subflows/rd-sign-in.yaml
- runFlow:
    file: ../subflows/rd-add-pose-form.yaml
    env:
      POSE_NAME: "QA processing pose"
- runFlow:
    when:
      notVisible:
        id: "addPose.consent.message"
    commands:
      - tapOn:
          id: "addPose.submitButton"
- runFlow: ../subflows/rd-consent-allow.yaml
- extendedWaitUntil:
    visible:
      id: "addPose.stageStatus"
    timeout: 30000
# No invented progress figures, and the screen says it is safe to leave.
- assertVisible: "You can leave this screen. Status continues in Jobs."
- assertNotVisible: '.*[0-9]+%.*'
- assertVisible:
    id: "addPose.viewJobsButton"
- assertVisible:
    id: "addPose.doneButton"
- tapOn:
    id: "addPose.doneButton"
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible: '.*QA processing pose.*'
    timeout: 30000
