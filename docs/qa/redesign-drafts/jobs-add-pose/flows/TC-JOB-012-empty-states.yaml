# TC-JOB-012 the three distinct Jobs empty states
appId: ${APP_ID}
tags: [TC-JOB-012, p0, e2e]
---
- runFlow: ../subflows/rd-launch.yaml
- runFlow: ../subflows/rd-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.processing"
    timeout: 20000
# Empty Finished offers a way back to Processing, without leaving the screen.
- tapOn:
    id: "jobs.tab.finish"
- runFlow:
    when:
      visible:
        id: "jobs.empty.goToProcessing"
    commands:
      - tapOn:
          id: "jobs.empty.goToProcessing"
      - assertVisible:
          id: "jobs.tab.processing"
# Empty Processing offers the finished list.
- runFlow:
    when:
      visible:
        id: "jobs.empty.viewFinished"
    commands:
      - tapOn:
          id: "jobs.empty.viewFinished"
      - assertVisible:
          id: "jobs.tab.finish"
# Empty filter offers Show all.
- tapOn:
    id: "jobs.filter.failed"
- runFlow:
    when:
      visible:
        id: "jobs.empty.showAll"
    commands:
      - tapOn:
          id: "jobs.empty.showAll"
      - assertVisible:
          id: "jobs.filter.all"
