# TC-JOB-013 offline keeps the cached rows and explains itself
appId: ${APP_ID}
tags: [TC-JOB-013, p1, e2e]
---
- runFlow: ../../../../mobile/iosApp/maestro/subflows/ext-launch.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/ext-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.jobs"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.finish"
    timeout: 20000
# The simulator cannot drop the network per app: this draft asserts the banner and the per-row waiting
# copy once the API is made unreachable (relaunch with a dead base URL, or stop the stub).
- runFlow:
    when:
      visible:
        id: "jobs.offline.banner"
    commands:
      - assertVisible: "You're offline. Progress resumes when you reconnect."
      - assertVisible:
          id: "jobs.tab.finish"
      - assertVisible: '.*Queued . waiting for connection.*'
