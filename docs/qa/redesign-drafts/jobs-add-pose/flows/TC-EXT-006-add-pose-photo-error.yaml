# TC-EXT-006 a rejected photo shows the inline banner and keeps the draft
appId: ${APP_ID}
tags: [TC-EXT-006, p1, e2e]
---
- runFlow: ../subflows/ext-launch.yaml
- runFlow: ../subflows/ext-sign-in.yaml
- runFlow:
    file: ../subflows/ext-add-pose-form.yaml
    env:
      POSE_NAME: "QA rejected photo"
- runFlow:
    when:
      notVisible:
        id: "addPose.consent.message"
    commands:
      - tapOn:
          id: "addPose.submitButton"
- runFlow:
    when:
      visible:
        id: "addPose.consent.allowButton"
    commands:
      - tapOn:
          id: "addPose.consent.allowButton"
# Only INVALID_IMAGE / IMAGE_TOO_LARGE land here; every other failure goes to the bottom snackbar.
- extendedWaitUntil:
    visible:
      id: "addPose.errorView"
    timeout: 90000
- assertVisible:
    id: "addPose.changePhotoButton"
- assertVisible:
    id: "addPose.nameField"
    text: ".*QA rejected photo.*"
