# TC-EXT-005 tag chips from one comma-separated entry, counter, hint
appId: ${APP_ID}
tags: [TC-EXT-005, p0, e2e]
---
- runFlow: ../subflows/rd-launch.yaml
- runFlow: ../subflows/rd-sign-in.yaml
- tapOn:
    id: "poses.add-pose"
- extendedWaitUntil:
    visible:
      id: "addPose.submitButton"
    timeout: 15000
# One comma-separated entry must produce two chips.
- tapOn:
    id: "addPose.tagsField"
- inputText: "standing, indoor"
- assertVisible:
    id: "addPose.tag.standing"
- assertVisible:
    id: "addPose.tag.indoor"
- tapOn:
    id: "addPose.nameField"
- inputText: "QA tag chips pose"
- assertVisible:
    id: "addPose.nameField"
    text: ".*QA tag chips pose.*"
- assertVisible:
    id: "addPose.descriptionCounter"
