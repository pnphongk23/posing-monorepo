# TC-CAM-016 zoom is three pills, and the chosen pill survives a relaunch
appId: ${APP_ID}
tags: [TC-CAM-016, p1]
---
- runFlow: ../../../../mobile/iosApp/maestro/subflows/launch.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/open-camera.yaml
# The row is three pills, not one cycling button.
- assertVisible:
    id: "camera.zoom.1x"
- assertVisible:
    id: "camera.zoom.2x"
- assertVisible:
    id: "camera.zoom.3x"
# Tapping 2x stays on the camera (no cycling, no navigation) — the *selection* itself is not readable yet:
# `camera.zoom.<label>` carries the `.isSelected` trait but no accessibilityValue, so this flow cannot prove
# which pill became current (Requests to Feature #1 in camera-guide.md). That half stays manual until it does.
- tapOn:
    id: "camera.zoom.2x"
- assertVisible:
    id: "camera.shutter"
- assertVisible:
    id: "camera.close"
# The zoom choice is persisted like the other camera settings.
- runFlow: ../../../../mobile/iosApp/maestro/subflows/relaunch-keep-state.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/open-camera.yaml
- assertVisible:
    id: "camera.zoom.2x"
- assertVisible:
    id: "camera.shutter"
