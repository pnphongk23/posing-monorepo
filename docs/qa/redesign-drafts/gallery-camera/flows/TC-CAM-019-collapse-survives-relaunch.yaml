# TC-CAM-019 the collapsed strip is remembered across a relaunch
appId: ${APP_ID}
tags: [TC-CAM-019, p1]
---
- runFlow: ../../../../mobile/iosApp/maestro/subflows/launch.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/open-camera.yaml
- assertVisible:
    id: "camera.poseStrip"
- tapOn:
    id: "camera.pickerStripToggle"
- assertNotVisible:
    id: "camera.poseStrip"
# Relaunch keeping the container: the collapsed state is one of the persisted camera settings.
- runFlow: ../../../../mobile/iosApp/maestro/subflows/relaunch-keep-state.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/open-camera.yaml
- assertNotVisible:
    id: "camera.poseStrip"
- assertVisible:
    id: "camera.pickerStripToggle"
# …and the way back still works after the relaunch.
- tapOn:
    id: "camera.pickerStripToggle"
- assertVisible:
    id: "camera.poseStrip"
