# TC-CAM-032 the Mirror row flips the pose GUIDE only, and says so in words
appId: ${APP_ID}
tags: [TC-CAM-032, p1]
---
- runFlow: ../../../../mobile/iosApp/maestro/subflows/launch.yaml
- runFlow: ../../../../mobile/iosApp/maestro/subflows/open-first-pose.yaml
- tapOn:
    id: "poseDetail.use"
- extendedWaitUntil:
    visible:
      id: "camera.poseGuide"
    timeout: 20000
- tapOn:
    id: "camera.tools"
- assertVisible:
    id: "camera.tools.mirror"
- assertVisible: "Mirror pose guide"
- assertVisible:
    id: "camera.tools.mirror.switch"
# Off by default; the switch reports its own state as a word, not only a colour.
- assertVisible: "Normal"
- tapOn:
    id: "camera.tools.mirror.switch"
- assertVisible: "Mirrored"
# The guide is still drawn (mirrored, not removed) and the camera itself is untouched.
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.shutter"
# Back to Normal, then close the panel.
- tapOn:
    id: "camera.tools.mirror.switch"
- assertVisible: "Normal"
- tapOn:
    point: "20%,45%"
- assertNotVisible:
    id: "camera.tools.mirror"
- assertVisible:
    id: "camera.poseGuide"
- assertVisible:
    id: "camera.pickerStripToggle"
