# TC-SET-007 the appearance choice is stored, not per-session
appId: ${APP_ID}
tags: [TC-SET-007, p0]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      id: "settings.appearance.system"
    direction: DOWN
- assertVisible:
    id: "settings.appearance.system"
    text: "Selected"
- tapOn:
    id: "settings.appearance.dark"
- assertVisible:
    id: "settings.appearance.dark"
    text: "Selected"
- assertVisible:
    id: "settings.appearance.system"
    text: "Not selected"
# Relaunch WITHOUT clearState: a stored preference outlives the process.
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-settings.yaml
- assertVisible:
    id: "settings.appearance.dark"
    text: "Selected"
- assertVisible:
    id: "settings.appearance.light"
    text: "Not selected"
