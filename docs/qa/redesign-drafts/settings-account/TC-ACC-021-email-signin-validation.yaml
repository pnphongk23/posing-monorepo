# DRAFT (move to maestro/flows once it is green on 1.1 (17)) — TC-ACC-021 empty fields are answered in place
# Copy is asserted verbatim from SignIn.swift at 0632361; a reworded message must fail this flow.
appId: ${APP_ID}
tags: [TC-ACC-021, p0]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
# The Account screen's email button carries `signin.emailEntry`; the sheet's email field reuses it.
- tapOn:
    id: "signin.emailEntry"
- assertVisible:
    id: "signin.password"
- tapOn:
    id: "signin.submit"
# One message per empty field...
- assertVisible: "Enter a valid email address, like name@example.com"
- assertVisible: "Enter your password"
# ...and the tap itself is still answered by the shared region.
- assertVisible: "Enter your email address and password."
# The sheet must stay open: a refused submit is not a dismissal.
- assertVisible:
    id: "signin.submit"
- assertVisible:
    id: "signin.emailEntry"
