# TC-ACC-021 empty and malformed fields are refused locally, per field
appId: ${APP_ID}
tags: [TC-ACC-021, p0]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.account.row"
# The Account screen's email button keeps the long-standing `signin.emailEntry` id; the sheet's email
# field uses the same id, so this tap opens the form and the next one focuses the field.
- tapOn:
    id: "signin.emailEntry"
- assertVisible:
    id: "signin.password"
- tapOn:
    id: "signin.submit"
- assertVisible:
    id: "signin.email.error"
- assertVisible:
    id: "signin.password.error"
# A malformed address is refused on its own field...
- tapOn:
    id: "signin.emailEntry"
- inputText: "maya@"
- tapOn:
    id: "signin.password"
- inputText: "correct horse battery"
- tapOn:
    id: "signin.submit"
- assertVisible:
    id: "signin.email.error"
- assertNotVisible:
    id: "signin.password.error"
# ...and correcting it clears the error without leaving the form.
- tapOn:
    id: "signin.emailEntry"
- eraseText
- inputText: "maya@example.com"
- assertNotVisible:
    id: "signin.email.error"
