# TC-SET-006 signed-out hub invites sign-in and promises nothing it cannot give
# Paywall ON explicitly: the Premium row only exists while the kill switch is on, and a flow must not
# depend on the remote value of the day.
appId: ${APP_ID}
tags: [TC-SET-006, p0]
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
      photos: allow
    arguments:
      AIPoseAccountsEnabled: "YES"
      AIPosePaywallEnabled: "YES"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- assertVisible:
    id: "settings.signIn.card"
# No identity card while signed out, but the way into Account is still one tap.
- assertNotVisible:
    id: "settings.accountCard"
- assertVisible:
    id: "settings.account.row"
- assertVisible:
    id: "settings.saved.row"
- assertVisible:
    id: "settings.premium.row"
