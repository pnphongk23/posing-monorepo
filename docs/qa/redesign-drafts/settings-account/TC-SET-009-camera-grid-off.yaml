# DRAFT (move to maestro/flows once the ids are committed) — TC-SET-009 Camera grid setting reaches the camera
# The cross-screen assertion is the point: a toggle that only flips itself proves nothing.
appId: ${APP_ID}
tags: [TC-SET-009, p1, draft]
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/open-camera.yaml
- assertVisible:
    id: "camera.grid"          # grid is on by default
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.camera.grid"
- runFlow: ../subflows/relaunch-keep-state.yaml
- runFlow: ../subflows/open-camera.yaml
- assertNotVisible:
    id: "camera.grid"
