# DRAFT (move to maestro/flows once the ids are committed) — TC-ACC-028 Manage subscription leaves the app
# The flow can only prove the app went to the background: the exact App Store URL must be pinned by a
# SupportDestinationsTests case (requested). Needs a signed-in entitled account.
appId: ${APP_ID}
tags: [TC-ACC-028, p1, draft]
---
- runFlow: ../subflows/launch-accounts-on.yaml
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: "settings.accountCard"
- tapOn:
    id: "account.manageSubscription"
# Safari takes the foreground, so the app's own row is no longer on screen.
- assertNotVisible:
    id: "account.manageSubscription"
