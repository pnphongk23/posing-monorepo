- tapOn:
    id: "settings.about"
- assertVisible:
    id: "about.version"
- assertVisible:
    id: "about.terms"
- assertVisible:
    id: "about.privacy"
- assertVisible:
    id: "about.licences"
- assertVisible:
    id: "about.contact"
# A sheet closes back to the hub, it does not stack a second Settings push.
- tapOn:
    id: "about.close"          # exists
- assertNotVisible:
    id: "about.version"
- assertVisible:
    id: "settings.about"
