# TC-PAY-017 the paywall is still usable at AX3 in dark mode
#
# Runner setup (device state, restored afterwards):
#   xcrun simctl ui <UDID> appearance dark
#   xcrun simctl ui <UDID> content_size accessibility-extra-large
#   … run … then: appearance light, content_size large
#
# Board 11-04/11-05 (and 11-paywall-ax3-scrolled in the owner notes) require: prices and renewal terms
# reachable by scrolling, and the pinned subscribe button with a clear inset — at AX3 the content is taller
# than the screen, so the case is about reachability, not layout pixels.
#
# Signed in on purpose: the plans (the tall part of the surface) only render for an account, and they are
# what AX3 has to survive. Nothing is bought — the CTA is scrolled to and read, never tapped.
appId: ${APP_ID}
tags: [TC-PAY-017, p2, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../../../../../mobile/iosApp/maestro/subflows/pay-launch.yaml
- runFlow: ../../../../../mobile/iosApp/maestro/subflows/pay-sign-in.yaml
- runFlow: ../../../../../mobile/iosApp/maestro/subflows/open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 40000
# The whole offer is reachable by scrolling at AX3, and the dock's CTA comes with it.
- scrollUntilVisible:
    element:
      id: "paywall.cta"
    direction: DOWN
    timeout: 25000
- assertVisible:
    id: "paywall.close"
- takeScreenshot: ../../../../../docs/qa/redesign-drafts/saved-paywall/screens/TC-PAY-017-ax3-dark
