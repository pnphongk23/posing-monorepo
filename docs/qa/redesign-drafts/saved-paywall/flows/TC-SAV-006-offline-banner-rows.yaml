# TC-SAV-006 offline: the banner explains the state and uncached rows say what they are
#
# Runs on build 18+ with the DEBUG-only fixture (`saved-launch-offline.yaml`) at 0 cached rows: every row
# is then outside the offline cache, which makes "Not saved offline" deterministic whatever the account
# happens to have saved. (The cached half — a row that still opens offline — needs n>=1 and at least n+1
# saved poses, so it is covered by the offline unit tests instead of by data luck.)
#
# What the case is about: an offline user must be able to tell "this list is what I have" from "this is
# everything I saved". A row the device cannot serve is labelled, not silently unopenable.
appId: ${APP_ID}
tags: [TC-SAV-006, p1, e2e]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow:
    file: ../../../../../mobile/iosApp/maestro/subflows/saved-launch-offline.yaml
    env:
      OFFLINE_CACHED_ROWS: "0"
- extendedWaitUntil:
    visible:
      id: "saved.offlineBanner"
    timeout: 30000
- assertVisible: "You.re offline. Changes will sync when you.re back online."
- assertVisible: "Not saved offline"
# The rows are still there (this is an offline list, not an empty one) …
- assertVisible:
    id: "poses.first-card"
# … and offline is its own state: neither the empty state nor the failure panel may appear.
- assertNotVisible:
    id: "saved.browseCommunity"
- assertNotVisible:
    id: "saved.retry"
