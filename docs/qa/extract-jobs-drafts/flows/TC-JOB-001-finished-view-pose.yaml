# TC-JOB-001 finished job -> View pose opens the private pose detail
appId: ${APP_ID}
tags: [TC-JOB-001, p0]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/ext-launch.yaml
- runFlow: ../subflows/ext-sign-in.yaml
- runFlow:
    file: ../subflows/ext-add-pose-form.yaml
    env:
      POSE_NAME: "QA finished pose"
- tapOn:
    id: "addPose.submitButton"
# The clean launch cleared the per-account ack, so the sheet must appear on this first upload.
- runFlow: ../subflows/ext-consent-allow.yaml
# Real extraction: wait for the job to succeed (the button only exists once status == succeeded).
- extendedWaitUntil:
    visible:
      id: "addPose.viewPoseButton"
    timeout: 240000
# The acceptance is the Jobs row action, not the processing shortcut: Jobs opens on Finish.
- tapOn:
    id: "addPose.viewJobsButton"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.finish"
    timeout: 20000
- assertVisible: "QA finished pose, Ready, View pose"
# The per-job id carries the jobId suffix, so the id is matched by regex.
- tapOn:
    id: "jobRow.viewPose..*"
# Private pose detail: Try this pose works, Save does not exist for a private pose.
- extendedWaitUntil:
    visible:
      id: "poseDetail.use"
    timeout: 30000
- assertNotVisible:
    id: "poseDetail.saveButton"
- tapOn:
    id: "poseDetail.back"
- extendedWaitUntil:
    visible:
      id: "jobs.tab.finish"
    timeout: 20000
- tapOn: "Back"
# The private pose is not in Saved.
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.header.saved"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "saved.loading"
    timeout: 20000
- assertNotVisible: "QA finished pose"
- tapOn: "Back"
# ...and not in Community search either.
- tapOn:
    id: "poses.open-search"
- tapOn:
    id: "search.field"
- inputText: "QA finished pose"
- extendedWaitUntil:
    visible:
      id: "search-empty-banner"
    timeout: 20000
