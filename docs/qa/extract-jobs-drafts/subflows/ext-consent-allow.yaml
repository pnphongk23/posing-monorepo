# Tap Allow on the consent sheet (used where the sheet may or may not appear).
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "addPose.consent.allowButton"
    timeout: 15000
- assertVisible:
    id: "addPose.consent.message"
    text: "To extract the pose, your photo is sent to a third-party AI service. The pose created from it is saved privately to your account until you delete it."
- tapOn:
    id: "addPose.consent.allowButton"
- assertNotVisible:
    id: "addPose.consent.message"
