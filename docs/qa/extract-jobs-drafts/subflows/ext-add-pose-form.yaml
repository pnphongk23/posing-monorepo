# Open Add pose, take one photo from the simulator library and fill the required fields.
# The photo comes from the simulator's own library (`xcrun simctl addmedia <udid> /tmp/<file>.jpg`).
appId: ${APP_ID}
---
- tapOn:
    id: "poses.add-pose"
- extendedWaitUntil:
    visible:
      id: "addPose.photoPicker"
    timeout: 15000
- tapOn:
    id: "addPose.photoPicker"
# System photo picker: the sheet is UIKit, so the first cell is addressed by position.
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 20000
- tapOn:
    point: "16%,26%"
- extendedWaitUntil:
    visible: "Change Photo"
    timeout: 20000
- tapOn:
    id: "addPose.nameField"
- inputText: ${POSE_NAME}
- tapOn:
    id: "addPose.tagsField"
- inputText: "standing"
- hideKeyboard
