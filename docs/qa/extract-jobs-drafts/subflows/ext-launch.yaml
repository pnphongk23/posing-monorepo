# Extraction on + accounts on, clean container and keychain. Order-independent start for the
# Add pose / Jobs flows, which all sign in afterwards with the run-time E2E account.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      camera: allow
      photos: allow
    arguments:
      AIPoseExtractPoseEnabled: "true"
      AIPoseAccountsEnabled: "YES"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 30000
