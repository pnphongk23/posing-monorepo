# S-05b gated capture, signed in: the paywall C structure renders on the production build
#
# Gate rules G5..G8: a signed-in, linked, confirmed-not-entitled account gets the paywall. On a **Prod-config
# simulator build the offering never resolves** (no StoreKit products in a Release binary on a simulator —
# the S-05b record of BLOCKED-BY-ENV), so paywall C honestly shows "Price unavailable"/"Plans unavailable"
# instead of a price. This flow therefore asserts the *structure* and the safety rule, never a price:
# the cards exist, the renewal disclosure and the legal row are there, and `paywall.cta` is present but
# **never tapped** — this build carries the live RevenueCat key, so a tap would start a real purchase.
#
# Prices are a TestFlight/device check (see docs/qa/test-cases/paywall-purchase.md, TC-PAY-018/019).
appId: ${APP_ID}
tags: [S-05, p0]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/prod-launch.yaml
- runFlow: ../subflows/prod-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- assertVisible:
    id: "settings.premium.row"
    label: "paywall_enabled is OFF in Firestore config/app - a gated press would capture (BLOCKED-BY-FLAG)"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 15000
- runFlow: ../subflows/prod-open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
# The C structure on the shipping build: X, steps, the paid step, both plan cards, the renewal disclosure and
# the legal row. Values stay env-dependent, so no price text is asserted here.
- assertVisible:
    id: "paywall.steps"
- assertVisible:
    id: "paywall.benefit"
- extendedWaitUntil:
    visible:
      id: "paywall.plan.annual"
    timeout: 30000
- assertVisible:
    id: "paywall.plan.monthly"
- assertVisible:
    id: "paywall.disclosure.autoRenew"
- assertVisible:
    id: "paywall.restore"
- assertVisible:
    id: "paywall.terms"
- assertVisible:
    id: "paywall.privacy"
- assertVisible:
    id: "paywall.cta"
- takeScreenshot: docs/qa/prod-smoke/screens/S-05b-paywall-signed-in-plans
# Leave without buying: `paywall.cta` is deliberately never tapped on this build.
- tapOn:
    id: "paywall.close"
- assertNotVisible:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
