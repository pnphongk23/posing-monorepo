# S-05 the gated action (capture) shows the paywall on the Prod build, driven by Firestore flags only
#
# Gate order (`PremiumGate.captureOutcome`, G1..G8): the paywall switches on `paywall_enabled`, and it can
# only appear for a signed-in account whose entitlement is a *confirmed* "no" — an unconfigured build,
# accounts off, a signed-out session or an unlinked provider all fail open and would capture instead.
#
# So the flow proves the switch state first, from the app itself: Settings renders its Premium row only
# while `AppConfig.shared.isPaywallEnabled` is true (`SupportScreens.swift:356`) — the *same* input gate
# rule G1 reads. With the row absent, "no paywall on the shutter" is not evidence about the gate at all,
# and the flow stops there as BLOCKED-BY-FLAG instead of pretending to be a failing case. With the row
# present, a missing paywall after the shutter would be a real finding.
#
# No purchase is ever started here: the flow closes the sheet.
appId: ${APP_ID}
tags: [S-05, p0]
---
- assertTrue:
    condition: ${E2E_EMAIL != null && E2E_EMAIL.length > 0 && E2E_PASSWORD != null && E2E_PASSWORD.length > 0}
    label: "E2E_EMAIL / E2E_PASSWORD missing - run with -e E2E_EMAIL=... -e E2E_PASSWORD=..."
- runFlow: ../subflows/prod-launch.yaml
- runFlow: ../subflows/prod-sign-in.yaml
- tapOn:
    id: "poses.more"
- tapOn:
    id: "poses.menu.settings"
- takeScreenshot: docs/qa/prod-smoke/screens/S-05-paywall-flag-surface
- assertVisible:
    id: "settings.premium.row"
    label: "paywall_enabled is OFF in Firestore config/app - gated capture cannot paywall (BLOCKED-BY-FLAG)"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "poses.open-search"
    timeout: 15000
- runFlow: ../subflows/prod-open-camera.yaml
- tapOn:
    id: "camera.shutter"
- extendedWaitUntil:
    visible:
      id: "paywall.close"
    timeout: 25000
- takeScreenshot: docs/qa/prod-smoke/screens/S-05-paywall-gated-capture
# Leave without buying anything; the camera is still the surface underneath.
- tapOn:
    id: "paywall.close"
- assertNotVisible:
    id: "paywall.close"
- assertVisible:
    id: "camera.shutter"
